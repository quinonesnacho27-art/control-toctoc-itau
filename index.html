<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de pagos TOCTOC · Itaú</title>
<style>
/* =========================================================
   ESTILOS GENERALES
   ========================================================= */
:root{
  --navy:#0B2A5B; --navy-2:#16407f; --navy-soft:#e9eff9;
  --orange:#EC7000; --orange-2:#ff8a1f; --orange-soft:#fff2e5;
  --bg:#f3f5f9; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e3e7ee;
  --green:#12805c; --green-soft:#e2f5ec;
  --yellow:#9a6400; --yellow-soft:#fff5d1; --yellow-line:#f2c037;
  --red:#c62828; --red-soft:#fdeaea;
  --blue:#1565c0; --blue-soft:#e6f0fc;
  --gray:#6b7280; --gray-soft:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.hidden{display:none!important}
h2{font-size:20px;margin:0 0 4px;color:var(--navy)}
h3{font-size:16px;margin:0;color:var(--navy)}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ---------- Encabezado fijo ---------- */
.app-header{position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(11,42,91,.12)}
.topbar{background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;gap:18px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--orange);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px;color:#fff}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand small{opacity:.8;font-size:12px}
.period{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:5px 8px;border-radius:10px}
.period label{font-size:12px;opacity:.85;margin-right:4px}
.period select{background:#fff;color:var(--navy);border:0;border-radius:7px;padding:5px 6px;font-weight:600;font-size:13px;cursor:pointer}
.pbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600}
.pbtn:hover{background:rgba(255,255,255,.3)}
.save-ind{font-size:12px;display:flex;flex-direction:column;align-items:flex-end;min-width:210px}
.save-ind .ok{color:#9ff0c9;font-weight:600}
.save-ind .bad{color:#ffd0a1;font-weight:600}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px;font-family:inherit}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--orange)}
.tab .count{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
.tab .count.zero{background:var(--gray-soft);color:var(--gray)}
.top-alert{background:var(--red);color:#fff;padding:9px 24px;display:flex;align-items:center;gap:12px;font-weight:600;flex-wrap:wrap}
.top-alert button{margin-left:auto}
.storage-warn{background:#7a3d00;color:#fff;padding:8px 24px;font-size:13px}

main{padding:20px 24px 60px;max-width:1680px;margin:0 auto}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Tarjetas ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.card + .card{margin-top:16px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.1)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy)}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;gap:6px;align-items:center}
.kpi .k-value{font-size:28px;font-weight:700;color:var(--navy);margin-top:4px}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.kpi.main{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;grid-column:span 2}
.kpi.main::before{background:var(--orange)}
.kpi.main .k-label,.kpi.main .k-sub{color:rgba(255,255,255,.8)}
.kpi.main .k-value{color:#fff;font-size:34px}
@media (max-width:520px){.kpi.main{grid-column:span 1}}
.kpi.green::before{background:var(--green)} .kpi.yellow::before{background:var(--yellow-line)}
.kpi.red::before{background:var(--red)} .kpi.blue::before{background:var(--blue)} .kpi.orange::before{background:var(--orange)}
.kpi.red .k-value{color:var(--red)} .kpi.blue .k-value{color:var(--blue)}

/* ---------- Gráfico ---------- */
.chart-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.donut{width:190px;height:190px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut-center b{font-size:28px;color:var(--navy)}
.donut-center span{font-size:12px;color:var(--muted)}
.bars{flex:1;min-width:240px}
.bar-row{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bar-track{background:var(--gray-soft);border-radius:999px;height:12px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .4s}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* ---------- Badges y estados ---------- */
.badge.wrap{white-space:normal}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-yellow{background:var(--yellow-soft);color:var(--yellow)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:var(--gray-soft);color:var(--gray)}
.b-orange{background:var(--orange-soft);color:#b45300}
.b-navy{background:var(--navy-soft);color:var(--navy)}

/* ---------- Botones ---------- */
.btn{border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover:not(:disabled){background:#d46400}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover:not(:disabled){background:var(--navy-2)}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:#a51f1f}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;display:inline-grid;place-items:center;color:var(--navy);padding:0}
.icon-btn:hover{background:var(--navy-soft);border-color:var(--navy)}
.icon-btn.danger{color:var(--red)} .icon-btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.icon-btn.warn{color:#b45300} .icon-btn.warn:hover{background:var(--orange-soft);border-color:var(--orange)}
.actions{display:flex;gap:4px;flex-wrap:nowrap}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--navy)}
input[type=text],input[type=number],input:not([type]),select,textarea{font-family:inherit;font-size:13px;border:1px solid #cfd6e2;border-radius:8px;padding:7px 9px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(236,112,0,.35);border-color:var(--orange)}
input.invalid,textarea.invalid{border-color:var(--red);background:#fff8f8}
input:disabled,select:disabled,textarea:disabled{background:#f3f4f6;color:#6b7280}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.err{color:var(--red);font-size:12px;min-height:0}
.hint{font-size:12px;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end}
.filters .field{margin:0}
.check{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--orange)}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#c7ced9;border-radius:999px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider::before{transform:translateX(18px)}
.switch input:disabled + .slider{opacity:.5;cursor:not-allowed}
input.mini{padding:4px 6px;font-size:12px;min-width:70px}

/* ---------- Tablas ---------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.table-wrap.tall{max-height:66vh}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th{position:sticky;top:0;z-index:2;background:#f6f8fc;color:var(--navy);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{background:var(--navy-soft)}
table.data th .arrow{color:var(--orange);margin-left:3px}
table.data td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.data tr:hover td{background:#fafbfe}
table.data tfoot td{font-weight:700;background:#f6f8fc}
tr.r-green td:first-child{box-shadow:inset 4px 0 0 var(--green)}
tr.r-yellow td:first-child{box-shadow:inset 4px 0 0 var(--yellow-line)}
tr.r-red td:first-child{box-shadow:inset 4px 0 0 var(--red)}
tr.r-red td{background:#fffafa}
tr.r-blue td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
tr.r-gray td{color:#7b8190}
tr.r-gray td:first-child{box-shadow:inset 4px 0 0 #b8bec9}
td.name-cell{font-weight:600;color:var(--navy);min-width:180px}
td.notes-cell{max-width:240px;font-size:12px;color:var(--muted)}
.counter{font-size:13px;color:var(--muted);margin:10px 2px}
.counter b{color:var(--navy)}
.diff-pos{color:var(--red);font-weight:700}
.diff-neg{color:var(--blue);font-weight:700}
.diff-zero{color:var(--green);font-weight:700}

/* ---------- Alertas ---------- */
.notice{border-radius:10px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.notice .ic{font-size:16px;line-height:1.2}
.n-info{background:var(--navy-soft);color:var(--navy);border:1px solid #cdd9ee}
.n-warn{background:var(--yellow-soft);color:#6d4800;border:1px solid #f3dc8a}
.n-error{background:var(--red-soft);color:#8e1c1c;border:1px solid #f5c2c2}
.n-success{background:var(--green-soft);color:#0d5f44;border:1px solid #b9e6d2}
.alert-card{border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:10px;padding:14px;background:#fff;margin-bottom:12px;box-shadow:var(--shadow)}
.alert-card.critical{border-left-color:var(--red)}
.alert-card.info{border-left-color:var(--yellow-line)}
.alert-card.reviewed{opacity:.7;border-left-color:var(--green)}
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:10px 0}
.alert-grid > div > span:first-child{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.alert-foot{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.alert-foot textarea{flex:1;min-width:220px;min-height:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--navy);font-family:inherit}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}
.check-list{list-style:none;padding:0;margin:0}
.check-list li{padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;display:flex;gap:10px}
.check-list li.ok{background:var(--green-soft);border-color:#b9e6d2}
.check-list li.fail{background:var(--red-soft);border-color:#f5c2c2}
.check-list .ic{font-weight:800}
.summary-list{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;font-size:13px}
.summary-list dt{color:var(--muted);font-weight:600}
.summary-list dd{margin:0}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.total-box{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.total-box > span:first-child{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.total-box b{font-size:20px;color:var(--navy)}
.total-box.final{background:var(--navy);border-color:var(--navy)}
.total-box.final > span:first-child{color:rgba(255,255,255,.8)} .total-box.final b{color:#fff}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px;background:#fff}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.pill-status{font-size:13px;padding:5px 12px}
.share-note{background:var(--orange-soft);border:1px solid #f7cfa6;color:#6b3600;border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-size:11px;font-weight:700;cursor:help;font-style:normal}
.kpi.main .info{background:rgba(255,255,255,.2);color:#fff}

/* ---------- Modales, toasts, tooltip ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,42,91,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .15s ease-out}
.modal.lg{max-width:1200px}
.modal.md{max-width:860px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px;max-height:calc(100vh - 220px);overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:11px 14px;border-left:5px solid var(--navy);font-size:13px;display:flex;gap:8px;animation:pop .15s}
.toast.success{border-left-color:var(--green)} .toast.error{border-left-color:var(--red)} .toast.warn{border-left-color:var(--orange)}
#tooltip{position:fixed;z-index:400;background:#14213d;color:#fff;font-size:12px;padding:7px 10px;border-radius:7px;max-width:300px;pointer-events:none;display:none;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.preview-box{background:#f6f8fc;border:1px dashed #c4cfe0;border-radius:10px;padding:12px;margin-top:4px}
.preview-box .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
</style>
</head>

<div id="storageWarn" class="storage-warn hidden">⚠ <b>localStorage no está disponible</b> en este navegador o modo de navegación. Los cambios solo se mantendrán mientras la pestaña esté abierta. Descarga un respaldo JSON antes de cerrar.</div>
<header class="app-header">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TT</div>
      <div>
        <h1>Control de pagos <span id="hdrCounterpart">TOCTOC</span></h1>
        <small>Proyectos inmobiliarios publicados en landing · Pagador: <span id="hdrPayer">Itaú</span></small>
      </div>
    </div>
    <div class="period" data-tip="Periodo de control. Todos los cálculos, alertas y la liquidación se actualizan según el mes seleccionado.">
      <label>Periodo</label>
      <button class="pbtn" onclick="shiftPeriod(-1)" aria-label="Mes anterior">‹</button>
      <select id="selMonth" onchange="onPeriodSelect()" aria-label="Mes"></select>
      <select id="selYear" onchange="onPeriodSelect()" aria-label="Año"></select>
      <button class="pbtn" onclick="shiftPeriod(1)" aria-label="Mes siguiente">›</button>
      <button class="pbtn" onclick="setPeriod(currentYM())" data-tip="Ir al mes actual">Hoy</button>
    </div>
    <div id="saveInd" class="save-ind"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div id="topAlert"></div>
</header>
<main id="main"></main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tooltip" role="tooltip"></div>
<div id="modalRoot"></div>
<script>
/* =========================================================================
   SINCRONIZACIÓN COMPARTIDA — módulo común del equipo hipotecario
   - Los datos viven en un servidor propio (Google Apps Script de la cuenta del
     administrador). No hay claves que ingresar: cada persona solo indica su nombre.
   - Cada cambio se envía solo (con unos segundos de espera). El servidor acepta
     la escritura solo si nadie guardó antes; si alguien lo hizo, se mezclan ambos
     cambios y se reintenta, así nunca se pisa el trabajo de otra persona.
   - Sin conexión o con el servidor ocupado: los cambios quedan en el equipo y se
     reintentan solos hasta lograrlo.
   - Los datos se comprimen (gzip + base64).
   ========================================================================= */
const CloudSync = (function(){
  'use strict';
  const API = 'https://script.google.com/macros/s/AKfycbyweuwBd_b9d_wA7QMgZoAN2DI4jYoPVcaX9qiUG4uhDjMx2pbIk_xuyVSgAd-5euGe/exec';
  const LS_NAME = 'itau_hip_name';
  const DEBOUNCE_MS = 2000;   // agrupa varios cambios seguidos en un solo envío
  let C = null, P = '', ov = null, pn = null, started = false, retryTimer = null, saveTimer = null, retryMs = 20000;
  const S = {legacy:false, rev:0, base:null, busy:false, again:false, dirty:false, state:'init', err:null, errCode:'',
             savedAt:'', savedBy:'', lastSync:0};
  const memStore = {};

  /* ---------- almacenamiento local (con respaldo en memoria) ---------- */
  const store = {
    get(k){ try{ const v = localStorage.getItem(k); return v === null ? (memStore[k] ?? null) : v; }catch(e){ return memStore[k] ?? null; } },
    set(k, v){ memStore[k] = v; try{ localStorage.setItem(k, v); }catch(e){} },
    del(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch(e){} }
  };
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const isObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);

  class SyncError extends Error { constructor(code, msg){ super(msg); this.code = code; } }

  /* ---------- comparación y mezcla de datos (3 vías) ---------- */
  function deepEqual(a, b){
    if(a === b) return true;
    if(a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
    if(Array.isArray(a) !== Array.isArray(b)) return false;
    if(Array.isArray(a)){
      if(a.length !== b.length) return false;
      for(let i = 0; i < a.length; i++) if(!deepEqual(a[i], b[i])) return false;
      return true;
    }
    const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined);
    if(ka.length !== kb.length) return false;
    for(const k of ka) if(!deepEqual(a[k], b[k])) return false;
    return true;
  }
  const hasIds = arr => arr.every(x => isObj(x) && x.id !== undefined && x.id !== null);
  /** b = última versión sincronizada, m = la mía, t = la del servidor. Devuelve la mezcla. */
  function merge(b, m, t, path){
    path = path || '';
    if(deepEqual(m, t)) return clone(m);
    if(deepEqual(m, b)) return clone(t);
    if(deepEqual(t, b)) return clone(m);
    if(isObj(m) && isObj(t)){
      const bb = isObj(b) ? b : {}, out = {};
      new Set(Object.keys(m).concat(Object.keys(t), Object.keys(bb))).forEach(k => {
        const r = mergeKey(bb[k], m[k], t[k], path + '/' + k);
        if(r !== undefined) out[k] = r;
      });
      return out;
    }
    if(Array.isArray(m) && Array.isArray(t)) return mergeArr(Array.isArray(b) ? b : [], m, t, path);
    return clone(m);            // conflicto en un valor simple: prevalece lo mío
  }
  function mergeKey(bv, mv, tv, path){
    if(mv === undefined && tv === undefined) return undefined;
    if(mv === undefined){ if(bv === undefined) return clone(tv); return deepEqual(tv, bv) ? undefined : clone(tv); }
    if(tv === undefined){ if(bv === undefined) return clone(mv); return deepEqual(mv, bv) ? undefined : clone(mv); }
    return merge(bv, mv, tv, path);
  }
  function mergeArr(b, m, t, path){
    if(hasIds(b) && hasIds(m) && hasIds(t)){
      const idx = a => { const o = new Map(); a.forEach(x => o.set(x.id, x)); return o; };
      const B = idx(b), M = idx(m), out = [], seen = new Set();
      t.forEach(ti => {
        seen.add(ti.id);
        const bi = B.get(ti.id), mi = M.get(ti.id);
        if(mi === undefined){ if(bi === undefined || !deepEqual(ti, bi)) out.push(clone(ti)); }   // si yo lo borré y nadie lo tocó, se va
        else out.push(merge(bi, mi, ti, path + '[]'));
      });
      m.forEach(mi => {
        if(seen.has(mi.id)) return;
        const bi = B.get(mi.id);
        if(bi === undefined || !deepEqual(mi, bi)) out.push(clone(mi));   // nuevo mío, o lo modifiqué y otro lo borró
      });
      return out;
    }
    const k = x => JSON.stringify(x);
    const bk = new Set(b.map(k)), mk = new Set(m.map(k)), tk = new Set(t.map(k));
    const kept = t.filter(x => !(bk.has(k(x)) && !mk.has(k(x))));
    const added = m.filter(x => !bk.has(k(x)) && !tk.has(k(x)));
    const pre = (C && C.prepend) || [];
    return (pre.indexOf(path) >= 0 ? added.concat(kept) : kept.concat(added)).map(clone);
  }

  /* ---------- compresión ---------- */
  const canGzip = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined' && typeof Response !== 'undefined';
  function toB64(u8){ let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function fromB64(b64){ const s = atob(b64), u8 = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8; }
  async function gzip(str){
    const cs = new CompressionStream('gzip'), w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(str)); w.close();
    return toB64(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
  }
  async function gunzip(b64){
    const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
    w.write(fromB64(b64)); w.close();
    return await new Response(ds.readable).text();
  }
  async function pack(data, rev){
    const env = {app:C.app, v:1, rev:rev, savedAt:new Date().toISOString(), savedBy:user() || 'sin nombre'};
    const json = JSON.stringify(data);
    if(canGzip()){ env.enc = 'gzip-b64'; env.data = await gzip(json); }
    else{ env.enc = 'json'; env.data = data; }
    if(JSON.stringify(env).length > 180000) throw new SyncError('size', 'Los datos superan el tamaño máximo del espacio compartido. Exporta un respaldo y depura registros antiguos.');
    return env;
  }
  async function unpack(env){
    if(env.enc === 'gzip-b64'){
      if(!canGzip()) throw new SyncError('browser', 'Este navegador no puede leer los datos comprimidos. Usa una versión reciente de Chrome, Edge, Firefox o Safari.');
      return JSON.parse(await gunzip(env.data));
    }
    return env.data;
  }

  /* ---------- servidor (Apps Script) ---------- */
  const user = () => (store.get(LS_NAME) || '').trim();
  async function call(opts, url){
    let r, j;
    try{ r = await fetch(url, Object.assign({cache:'no-store', redirect:'follow'}, opts)); }
    catch(e){ throw new SyncError('network', 'Sin conexión con el servidor.'); }
    if(!r.ok) throw new SyncError('network', 'El servidor no respondió (código ' + r.status + ').');
    try{ j = await r.json(); }catch(e){ throw new SyncError('network', 'Respuesta inesperada del servidor.'); }
    return j;
  }
  async function srvGet(){
    const j = await call({method:'GET'}, API + '?op=get&app=' + encodeURIComponent(C.app) + '&t=' + Date.now());
    if(!j.ok) throw new SyncError('server', j.error || 'Error del servidor.');
    return j.env || null;
  }
  /** Devuelve {ok:true, rev} o {conflict:true, env}. */
  async function srvPut(env, baseRev){
    const j = await call({method:'POST', body: JSON.stringify({op:'put', app:C.app, baseRev:baseRev, env:env})}, API);
    if(j.ok) return {ok:true, rev:j.rev};
    if(j.conflict) return {conflict:true, env:j.env || null};
    throw new SyncError('server', j.error || 'Error del servidor.');
  }

  /* ---------- metadatos locales (última versión sincronizada) ---------- */
  function loadMeta(){
    try{
      const m = JSON.parse(store.get(P + 'sync2') || 'null');
      if(m && m.base){ S.base = m.base; S.rev = m.rev || 0; S.savedAt = m.savedAt || ''; S.savedBy = m.savedBy || ''; S.lastSync = m.lastSync || 0; S.dirty = !!m.dirty; }
    }catch(e){}
    // Datos de la versión anterior (JSONBin): este equipo ya trabajaba con el equipo
    if(!S.base && store.get(P + 'sync')) S.legacy = true;
    // limpieza de credenciales antiguas que ya no se usan
    store.del('itau_hip_key'); store.del(P + 'bin');
  }
  function saveMeta(){
    store.set(P + 'sync2', JSON.stringify({base:S.base, rev:S.rev, savedAt:S.savedAt, savedBy:S.savedBy, lastSync:S.lastSync, dirty:S.dirty}));
    if(S.base && S.legacy){ S.legacy = false; store.del(P + 'sync'); }
  }

  /* ---------- estado visible ---------- */
  function fmtDT(iso){
    if(!iso) return '';
    const d = new Date(iso); if(isNaN(d)) return '';
    const p = n => String(n).padStart(2, '0');
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function info(){
    const base = {state:S.state, dirty:S.dirty, savedAt:S.savedAt, savedBy:S.savedBy, savedAtText:fmtDT(S.savedAt), user:user(), error:S.err};
    const last = S.savedAt ? 'Última modificación: ' + fmtDT(S.savedAt) + (S.savedBy ? ' por ' + S.savedBy : '') : '';
    const txt = {
      init:'Iniciando…', loading:'Conectando con el equipo…', saving:'Guardando cambios…',
      ok:'Sincronizado con el equipo', offline:'Sin conexión: tus cambios quedan en este equipo y se enviarán solos',
      error:'No se pudo sincronizar: ' + (S.err || '')
    }[S.state] || '';
    const short = {init:'…', loading:'Conectando…', saving:'Guardando…', ok:'Sincronizado', offline:'Sin conexión', error:'Error de sincronización'}[S.state] || '';
    return Object.assign(base, {text:txt, short:short, last:last});
  }
  function setStatus(state, err, code){
    S.state = state; S.err = err || null; S.errCode = code || '';
    try{ C.onStatus && C.onStatus(info()); }catch(e){}
    if(pn && !pn.classList.contains('cs-hidden')) renderPanel();
  }

  /* ---------- ciclo de sincronización ---------- */
  function schedule(ms){ clearTimeout(saveTimer); saveTimer = setTimeout(() => sync('auto'), ms == null ? DEBOUNCE_MS : ms); }
  /** Avisa que hubo un cambio local (lo llama la aplicación al guardar). */
  function changed(){
    if(!started || !S.base) return;
    S.dirty = true; saveMeta(); setStatus('saving'); schedule();
  }
  /** Decide qué debe quedar en el servidor a partir de lo mío y lo del servidor. */
  function target(mine, theirs, env){
    if(theirs === null) return mine;                         // servidor vacío: subo lo mío
    if(S.base) return merge(S.base, mine, theirs, '');       // caso normal: mezcla de 3 vías
    if(S.legacy) return env && env.seed ? mine : merge({}, mine, theirs, '');   // migración: unión
    return theirs;                                           // dispositivo nuevo: tomo lo del equipo
  }
  async function syncCore(){
    const mine = C.getData();
    // Con cambios pendientes se intenta guardar directo (1 sola solicitud);
    // si alguien guardó antes, el servidor responde con su versión y se mezcla.
    let env = (S.base && S.dirty) ? {local:true} : await srvGet();
    for(let i = 0; i < 6; i++){
      let theirs = null, rev = 0;
      if(env && env.local){ theirs = S.base; rev = S.rev; }
      else if(env){ theirs = await unpack(env); rev = env.rev || 0; }
      const want = target(mine, theirs, env);
      if(theirs !== null && deepEqual(want, theirs)){
        if(!(env && env.local)){ S.savedAt = env.savedAt || ''; S.savedBy = env.savedBy || ''; }
        return {merged:theirs, rev:rev, mine:mine};
      }
      const out = await pack(want, rev + 1);
      if(theirs === null && !S.base && !S.legacy) out.seed = true;
      const res = await srvPut(out, rev);
      if(res.ok){ S.savedAt = out.savedAt; S.savedBy = out.savedBy; return {merged:want, rev:res.rev, mine:mine}; }
      env = res.env;                                         // conflicto: vuelvo a mezclar con lo vigente
    }
    throw new SyncError('busy', 'Mucha actividad simultánea; se reintentará en unos segundos.');
  }
  async function sync(reason){
    if(!started) return;
    if(S.busy){ S.again = true; return; }
    S.busy = true; clearTimeout(retryTimer);
    if(S.state !== 'saving') setStatus(S.base ? (S.dirty ? 'saving' : 'loading') : 'loading');
    try{
      const r = await syncCore();
      S.base = clone(r.merged); S.rev = r.rev; S.lastSync = Date.now();
      const cur = C.getData();
      if(!deepEqual(cur, r.mine)){            // el usuario siguió editando mientras se enviaba
        C.applyData(merge(r.mine, cur, r.merged, ''));
        S.dirty = true; S.again = true;
      }else{
        if(!deepEqual(r.merged, r.mine)) C.applyData(r.merged);
        S.dirty = false;
      }
      saveMeta(); retryMs = 5000;
      setStatus('ok');
    }catch(e){
      const code = e.code || 'unknown';
      if(S.base){ S.dirty = !deepEqual(C.getData(), S.base); saveMeta(); }
      if(code === 'network' || code === 'busy') setStatus('offline', e.message, code);
      else setStatus('error', e.message || String(e), code);
      // siempre se reintenta solo, con espera creciente (máx. 2 minutos)
      retryTimer = setTimeout(() => sync('retry'), retryMs); retryMs = Math.min(retryMs * 2, 120000);
    }finally{
      S.busy = false;
      if(S.again){ S.again = false; schedule(300); }
    }
  }
  const modalOpen = () => C.isBusyUI ? !!C.isBusyUI() : false;
  /** Actualización manual desde el botón. */
  async function refresh(){ clearTimeout(saveTimer); await sync('manual'); }

  /* ---------- interfaz: pantalla de configuración, bloqueo y panel ---------- */
  const CSS = `
  .cs-ov{position:fixed;inset:0;z-index:9000;background:rgba(15,27,51,.78);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#2C3440}
  .cs-ov.cs-solid{background:#E7ECF5}
  .cs-hidden{display:none!important}
  .cs-card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(16,24,40,.28);max-width:460px;width:100%;padding:24px 22px;margin:auto}
  .cs-brand{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#EC7000;margin-bottom:6px}
  .cs-card h2{margin:0 0 8px;font-size:20px;color:#1B2A4A}
  .cs-card p{margin:0 0 12px;font-size:14px;line-height:1.45;color:#5B6573}
  .cs-card label{display:block;font-size:12px;font-weight:700;color:#5B6573;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px}
  .cs-card input[type=text],.cs-card input[type=password]{width:100%;padding:11px 12px;border:1px solid #CBD2DC;border-radius:10px;font-size:16px;font-family:inherit;color:#2C3440;background:#fff}
  .cs-card input:focus{outline:none;border-color:#1B2A4A;box-shadow:0 0 0 3px #E7ECF5}
  .cs-row{display:flex;gap:8px;align-items:center}
  .cs-row input{flex:1;min-width:0}
  .cs-btn{border:1px solid #1B2A4A;background:#1B2A4A;color:#fff;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:16px}
  .cs-btn:hover{background:#0F1B33}.cs-btn:disabled{opacity:.55;cursor:wait}
  .cs-btn.cs-sec{background:#fff;color:#1B2A4A;border-color:#CBD2DC}.cs-btn.cs-sec:hover{background:#F7F8FA}
  .cs-btn.cs-acc{background:#EC7000;border-color:#EC7000}.cs-btn.cs-acc:hover{background:#D46400}
  .cs-btn.cs-mini{width:auto;margin:0;padding:10px 12px;font-size:13px}
  .cs-err{background:#FBE6E6;border:1px solid #F1C7C7;color:#C62828;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:12px}
  .cs-ok{background:#E4F4EA;border:1px solid #BFE3CD;color:#116135;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
  .cs-note{background:#FFF0E0;border:1px solid #F6D6B5;color:#8F4400;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .cs-card details{margin-top:16px;border-top:1px solid #E2E6EC;padding-top:12px;font-size:13px;color:#5B6573}
  .cs-card summary{cursor:pointer;font-weight:700;color:#1B2A4A}
  .cs-big{font-family:Consolas,Menlo,monospace;font-size:16px;font-weight:700;background:#F7F8FA;border:1px dashed #A8B0BC;border-radius:10px;padding:10px 12px;word-break:break-all;color:#1B2A4A}
  .cs-kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px;margin:10px 0}.cs-kv b{color:#5B6573;font-weight:700}
  .cs-spin{width:34px;height:34px;border:4px solid #E7ECF5;border-top-color:#EC7000;border-radius:50%;animation:cs-r 1s linear infinite;margin:6px auto 14px}
  @keyframes cs-r{to{transform:rotate(360deg)}}
  .cs-center{text-align:center}`;

  function buildUI(){
    if(ov) return;
    const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    ov = document.createElement('div'); ov.className = 'cs-ov cs-hidden'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); document.body.appendChild(ov);
    pn = document.createElement('div'); pn.className = 'cs-ov cs-hidden'; pn.setAttribute('role', 'dialog'); pn.setAttribute('aria-modal', 'true'); document.body.appendChild(pn);
    pn.addEventListener('mousedown', e => { if(e.target === pn) closePanel(); });
  }
  const $o = sel => ov.querySelector(sel);
  function showOv(html, solid){ ov.className = 'cs-ov' + (solid ? ' cs-solid' : ''); ov.innerHTML = html; }
  function hideOv(){ ov.className = 'cs-ov cs-hidden'; ov.innerHTML = ''; }

  function showBlock(text){
    showOv('<div class="cs-card cs-center"><div class="cs-brand">' + esc(C.title) + '</div><div class="cs-spin"></div><h2>' + esc(text) + '</h2><p>Un momento por favor…</p></div>', true);
  }
  let failTimer = null;
  function showFailure(){
    const msg = S.err || 'No se pudo conectar.';
    showOv('<div class="cs-card"><div class="cs-brand">' + esc(C.title) + '</div><h2>No pudimos cargar los datos</h2><div class="cs-err">' + esc(msg) + '</div>' +
      '<p style="margin-top:12px">Se reintentará automáticamente en unos segundos. Revisa tu conexión a internet.</p>' +
      '<button class="cs-btn cs-acc" id="cs-retry">Reintentar ahora</button></div>', true);
    $o('#cs-retry').onclick = firstLoad;
    clearTimeout(failTimer); failTimer = setTimeout(() => { if(!S.base) firstLoad(); }, 15000);
  }
  async function firstLoad(){
    clearTimeout(failTimer); clearTimeout(retryTimer);
    showBlock('Cargando datos del equipo…');
    started = true; await sync('start');
    clearTimeout(retryTimer);
    if(S.base){ hideOv(); attachEvents(); } else showFailure();
  }
  function showSetup(errMsg){
    buildUI();
    showOv('<div class="cs-card"><div class="cs-brand">' + esc(C.title) + ' · Hipotecario Itaú</div><h2>Bienvenido/a</h2>' +
      '<p>Esta herramienta es compartida: <b>todo el equipo ve los mismos datos</b> y cada cambio se guarda solo. Escribe tu nombre (se pide una sola vez en este dispositivo) para registrar quién hace cada cambio.</p>' +
      '<label for="cs-name">Tu nombre</label><input type="text" id="cs-name" autocomplete="name" placeholder="Ej.: Karol Riascos" value="' + esc(user()) + '">' +
      (errMsg ? '<div class="cs-err" id="cs-err">' + esc(errMsg) + '</div>' : '<div id="cs-err"></div>') +
      '<button class="cs-btn" id="cs-go">Continuar</button></div>', true);
    $o('#cs-go').onclick = submitSetup;
    $o('#cs-name').addEventListener('keydown', e => { if(e.key === 'Enter') submitSetup(); });
  }
  function setupErr(msg){ const e = $o('#cs-err'); if(e){ e.className = msg ? 'cs-err' : ''; e.textContent = msg || ''; } }
  function submitSetup(){
    const name = $o('#cs-name').value.trim();
    if(!name){ setupErr('Escribe tu nombre: queda registrado junto a los cambios que hagas.'); return; }
    store.set(LS_NAME, name);
    if(S.base){ hideOv(); started = true; attachEvents(); sync('setup'); }
    else firstLoad();
  }

  /* Panel de sincronización (botón del encabezado) */
  function openPanel(){ buildUI(); renderPanel(); pn.className = 'cs-ov'; }
  function closePanel(){ pn.className = 'cs-ov cs-hidden'; pn.innerHTML = ''; }
  function renderPanel(){
    const i = info();
    const cls = i.state === 'ok' ? 'cs-ok' : (i.state === 'error' ? 'cs-err' : 'cs-note');
    pn.innerHTML = '<div class="cs-card"><div class="cs-brand">' + esc(C.title) + '</div><h2>Sincronización</h2>' +
      '<div class="' + cls + '">' + esc(i.text) + (i.dirty && i.state !== 'saving' ? ' · hay cambios pendientes de envío' : '') + '</div>' +
      '<div class="cs-kv"><b>Última vez</b><span>' + esc(i.last || '—') + '</span><b>Tu nombre</b><span><input type="text" id="cs-pname" value="' + esc(i.user) + '"></span></div>' +
      '<button class="cs-btn cs-acc" id="cs-now">Actualizar ahora</button>' +
      '<button class="cs-btn cs-sec" id="cs-close">Cerrar</button></div>';
    const q = s => pn.querySelector(s);
    q('#cs-now').onclick = async () => { q('#cs-now').disabled = true; await refresh(); };
    q('#cs-close').onclick = closePanel;
    q('#cs-pname').onchange = e => { const v = e.target.value.trim(); if(v) store.set(LS_NAME, v); };
  }

  /* ---------- eventos del navegador ---------- */
  let evAttached = false;
  function attachEvents(){
    if(evAttached) return; evAttached = true;
    window.addEventListener('online', () => { if(S.dirty || S.state === 'offline') sync('online'); });
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'hidden'){ if(S.dirty && !S.busy){ clearTimeout(saveTimer); sync('hidden'); } }
      else if(Date.now() - S.lastSync > 60000 && !S.busy && !modalOpen()) sync('visible');
    });
    // trae los cambios de los demás cada 3 minutos mientras la pestaña está visible
    setInterval(() => { if(document.visibilityState === 'visible' && !S.busy && !modalOpen() && Date.now() - S.lastSync > 170000) sync('poll'); }, 30000);
    window.addEventListener('beforeunload', e => { if(S.dirty){ e.preventDefault(); e.returnValue = ''; } });
  }

  /* ---------- arranque ---------- */
  /** cfg: {app,prefix,title,getData(),applyData(d),onStatus(info),isBusyUI(),prepend:[]} */
  function init(cfg){
    C = cfg; P = cfg.prefix + '_';
    buildUI(); loadMeta();
    if(!user()){ showSetup(''); return; }
    if(!S.base){ firstLoad(); return; }
    started = true; attachEvents(); setStatus('loading'); sync('start');
  }

  return {init, changed, refresh, openPanel, info, user, _test:{merge, deepEqual, S, sync}};
})();

</script>
<script>
'use strict';
/* =========================================================
   1. CONSTANTES
   ========================================================= */
const STORAGE_KEY = 'control_toctoc_itau_v2';
const TOCTOC_STATES = ['Publicado, No cliente', 'Publicado, Cliente', 'Pendiente', 'Eliminado de pago', 'Eliminado de landing'];
const LANDING_STATES = ['Publicado', 'Pendiente de publicación', 'Eliminado de landing'];

const GENERAL_STATES = ['Conforme', 'Requiere revisión', 'Rechazado'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TABS = [
  {id:'dashboard', label:'◧ Dashboard'},
  {id:'projects', label:'▤ Proyectos'},
  {id:'alerts', label:'⚠ Alertas'},
  {id:'liq', label:'◈ Liquidación mensual'},
  {id:'history', label:'⟲ Historial'},
  {id:'config', label:'⚙ Configuración'}
];
const SHARE_NOTE = 'Los datos se guardan en la nube y los ve todo el equipo (solo se pide tu nombre la primera vez). Cada cambio se envía automáticamente; sin conexión, queda en este equipo y se envía al reconectar. Descarga respaldos periódicamente.';

/* =========================================================
   2. UTILIDADES (fechas, números, texto)
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function currentYM(){ return todayISO().slice(0, 7); }
function nowStamp(){ const d = new Date(); return `${todayISO()}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
/** Muestra un timestamp interno como DD/MM/AAAA HH:MM */
function fmtStamp(s){ if(!s) return '—'; const [d, t] = String(s).split('T'); return fmtCL(d) + (t ? ' ' + t.slice(0, 5) : ''); }
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
/** Valida una fecha interna ISO AAAA-MM-DD */
function isValidISO(s){
  if(typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  if(y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1) return false;
  return d <= daysInMonth(y, m);
}
/** Formato chileno DD/MM/AAAA para mostrar */
function fmtCL(iso){ if(!iso) return '—'; if(!isValidISO(iso)) return 'Inválida'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function ymOf(iso){ return String(iso).slice(0, 7); }
function isValidYM(s){ return /^\d{4}-(0[1-9]|1[0-2])$/.test(s || ''); }
/** Suma meses a un periodo AAAA-MM comparando año y mes (sin días fijos) */
function addMonths(ym, n){ const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`; }
/** Diferencia en meses calendario entre dos periodos AAAA-MM */
function monthDiff(a, b){ const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function periodLabel(ym){ if(!isValidYM(ym)) return '—'; const [y, m] = ym.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; }
function periodShort(ym){ if(!isValidYM(ym)) return '—'; const [y, m] = ym.split('-').map(Number); return `${MONTHS_SHORT[m-1]}-${y}`; }
/** Interpreta estrictamente DD/MM/AAAA (nunca MM/DD). Devuelve ISO o null */
function parseCLStrict(str){
  const s = String(str || '').trim();
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(!m) return null;
  const iso = `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return isValidISO(iso) ? iso : null;
}
/** Interpreta fechas de importación según el formato elegido (DMY por defecto). */
function parseDateFlexible(raw, fmt){
  let s = String(raw ?? '').trim();
  if(!s) return {iso:'', empty:true};
  s = s.replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\s*[ap]\.?\s*m\.?)?$/i, ''); // quita hora "0:00"
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const [y, m, d] = s.split('-'); const iso = `${y}-${pad(+m)}-${pad(+d)}`;
    return isValidISO(iso) ? {iso} : {error:'Fecha inválida'};
  }
  if(/^\d{5}(\.\d+)?$/.test(s)){ // número de serie de Excel
    const n = Math.floor(parseFloat(s)); const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
    const iso = d.toISOString().slice(0, 10);
    return isValidISO(iso) ? {iso} : {error:'Fecha inválida'};
  }
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(!m) return {error:'Formato no reconocido'};
  if(m[3].length !== 4) return {error:'Año incompleto (usar AAAA)'};
  const a = +m[1], b = +m[2];
  const [d, mo] = fmt === 'MDY' ? [b, a] : [a, b];
  const iso = `${m[3]}-${pad(mo)}-${pad(d)}`;
  if(!isValidISO(iso)) return {error:'Fecha inválida para ' + (fmt === 'MDY' ? 'MM/DD/AAAA' : 'DD/MM/AAAA')};
  return {iso, both12: a <= 12 && b <= 12 && a !== b};
}
/** Convierte "0,5" o "0.5" en número */
function parseNum(v){
  if(typeof v === 'number') return v;
  let s = String(v ?? '').trim().replace(/\s/g, '');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
const r4 = x => Math.round((Number(x) || 0) * 10000) / 10000;
/** Número con coma decimal (formato chileno) */
function fmtNum(n, max = 2){ return Number(n || 0).toLocaleString('es-CL', {minimumFractionDigits:0, maximumFractionDigits:max}); }
function fmtUF(n){ return fmtNum(n) + ' ' + (state ? state.config.currency : 'UF'); }
function fmtDiff(n){ const v = r4(n); const cls = v > 0 ? 'diff-pos' : v < 0 ? 'diff-neg' : 'diff-zero'; return `<span class="${cls}">${v > 0 ? '+' : ''}${fmtUF(v)}</span>`; }
function norm(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* =========================================================
   3. ESTADO Y PERSISTENCIA (localStorage)

let state = null;
let storageOK = true;
const ui = {

    counterpart:'TOCTOC', payer:'Itaú', currency:'UF', defaultPeriod:'', ivaPct:19};
}
function defaultState(){

}
function defaultSettlement(){
  return {banner:{active:true, unit:null, billedQty:null, obs:'', review:'Pendiente'},

          ivaOn:false, ivaPct:null, generalStatus:'', obs:''};

function cfg(){ return state.config; }
/** Normaliza un estado cargado (respaldo o localStorage) para evitar campos faltantes */
function normalizeState(raw){
  const s = Object.assign(defaultState(), raw || {});
  s.config = Object.assign(defaultConfig(), s.config || {});
  s.projects = Array.isArray(s.projects) ? s.projects : [];
  s.projects.forEach(p => {
    p.id = p.id || uid(); p.name = p.name || ''; p.group = p.group || ''; p.notes = p.notes || '';
    if(!TOCTOC_STATES.includes(p.toctoc)) p.toctoc = 'Pendiente';
    if(!LANDING_STATES.includes(p.landing)) p.landing = 'Publicado';
    p.pubDate = p.pubDate || ''; p.billingHistory = p.billingHistory || [];
    p.billingRemoved = p.billingRemoved || null; p.landingRemoved = p.landingRemoved || null;
    p.archived = !!p.archived;
  });
  ['alertReviews','settlements','closures'].forEach(k => { if(!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  Object.keys(s.settlements).forEach(k => {
    const d = defaultSettlement(), x = s.settlements[k];
    s.settlements[k] = Object.assign(d, x, {banner:Object.assign(d.banner, x.banner || {}), leads:Object.assign(d.leads, x.leads || {}), inc:Object.assign(d.inc, x.inc || {})});
  });
  s.closureArchive = Array.isArray(s.closureArchive) ? s.closureArchive : [];
  s.log = Array.isArray(s.log) ? s.log : [];
  return s;
}
function load(){

function addLog(action, detail){

function getSet(P, create){
  if(!state.settlements[P]){ if(!create) return defaultSettlement(); state.settlements[P] = defaultSettlement(); }
  return state.settlements[P];

function findP(id){ return state.projects.find(p => p.id === id); }

/* =========================================================
   4. LÓGICA DE NEGOCIO
   ========================================================= */
/** Periodos de pago (mes 1..N) de un proyecto */
function payMonths(p){ if(!isValidISO(p.pubDate)) return []; const ym = ymOf(p.pubDate); return Array.from({length:cfg().maxMonths}, (_, i) => addMonths(ym, i)); }
/** Fecha desde la cual no corresponde pagar = inicio del mes N+1 */
function noPayDate(p){ if(!isValidISO(p.pubDate)) return ''; return addMonths(ymOf(p.pubDate), cfg().maxMonths) + '-01'; }

/**
 * Estado de cobro de un proyecto en un periodo AAAA-MM.
 * Códigos: CHARGE (cobrable mes m), OUT (mes > N, eliminar del cobro), CLIENT, RB (eliminado del cobro),
 * RL (eliminado de landing), PEND (pendiente), NS (aún no inicia), INV (fecha inválida), ARC (archivado)
 */
function statusInfo(p, period){
  const N = cfg().maxMonths;
  const mk = (code, m) => {
    const d = {
      CHARGE: {cls: m === N ? 'yellow' : 'green', pay:`Mes ${m} de ${N}`, bill: m === N ? 'Cobrable · último mes' : 'Cobrable'},
      OUT: {cls:'red', pay:'Fuera de periodo', bill:'Eliminar del cobro'},
      CLIENT: {cls:'blue', pay:`No aplica, cliente ${cfg().counterpart}`, bill:'No se cobra (cliente)'},
      RB: {cls:'gray', pay:'Fuera de periodo', bill:'Eliminado del cobro'},
      RL: {cls:'gray', pay:'Fuera de periodo', bill:'Sin cobro (fuera de landing)'},
      PEND: {cls:'gray', pay:'Pendiente', bill:'Sin cobro (pendiente)'},
      NS: {cls:'gray', pay:'Aún no publicado', bill:'Sin cobro (aún no inicia)'},
      INV: {cls:'gray', pay:'Revisar fecha', bill:'Revisar fecha'},
      ARC: {cls:'gray', pay:'Archivado', bill:'Archivado'}
    }[code];
    return {code, m: m || null, cls:d.cls, payLabel:d.pay, billingLabel:d.bill, chargeable: code === 'CHARGE'};
  };
  if(p.archived) return mk('ARC');
  let st = p.toctoc;
  if(st === 'Eliminado de pago'){
    if(p.billingRemoved && isValidYM(p.billingRemoved.period) && period < p.billingRemoved.period) st = p.billingRemoved.prevStatus || 'Publicado, No cliente';
    else return mk('RB');
  }
  if(p.landing === 'Eliminado de landing' || st === 'Eliminado de landing'){
    if(p.landingRemoved && isValidYM(p.landingRemoved.period) && period < p.landingRemoved.period){
      if(st === 'Eliminado de landing') st = p.landingRemoved.prevStatus || 'Publicado, No cliente';
    } else return mk('RL');
  }
  if(st === 'Pendiente' || p.landing === 'Pendiente de publicación') return mk('PEND');
  if(!isValidISO(p.pubDate)) return mk('INV');
  const m = monthDiff(ymOf(p.pubDate), period) + 1;
  if(m < 1) return mk('NS');
  if(st === 'Publicado, Cliente') return mk('CLIENT', m);
  if(st === 'Eliminado de landing') return mk('RL');
  return m <= N ? mk('CHARGE', m) : mk('OUT', m);
}
function rowsFor(P){ return state.projects.map(p => ({p, si:statusInfo(p, P)})); }
function isPublishedIn(r, P){
  if(['CHARGE','OUT','CLIENT'].includes(r.si.code)) return true;
  return r.si.code === 'RB' && isValidISO(r.p.pubDate) && ymOf(r.p.pubDate) <= P && r.p.landing !== 'Eliminado de landing';
}

/** Genera las alertas automáticas del periodo */
function computeAlerts(P){
  const c = cfg(), N = c.maxMonths, out = [];
  const active = state.projects.filter(p => !p.archived);
  const groupsWithClients = new Set(active.filter(p => p.toctoc === 'Publicado, Cliente').map(p => norm(p.group)).filter(g => g && g !== 'sin grupo'));
  const dupMap = {};
  active.forEach(p => { const k = norm(p.name) + '|' + norm(p.group); (dupMap[k] = dupMap[k] || []).push(p); });
  active.forEach(p => {
    const si = statusInfo(p, P);
    const add = (type, severity, reason, action) => out.push({key:type + ':' + p.id, type, severity, p, si, reason, action});
    if(si.code === 'CHARGE' && si.m === N)
      add('last', 'info', `Está en el mes ${N} de ${N}: es su último mes de pago.`, `Mantener en el cobro de ${periodLabel(P)} e informar a ${c.counterpart} que desde el ${fmtCL(noPayDate(p))} no corresponde cobrarlo.`);
    if(si.code === 'OUT')
      add('out', 'critical', `Llegó al mes ${si.m}: ya se pagaron sus ${N} meses. No corresponde pagar desde el ${fmtCL(noPayDate(p))}.`, 'Eliminar del cobro y verificar que no venga en la factura.');
    if(si.code === 'INV' || (p.pubDate && !isValidISO(p.pubDate)))
      add('date', 'critical', p.pubDate ? `Fecha de publicación inválida (${esc(p.pubDate)}).` : 'Fecha de publicación incompleta.', 'Completar o corregir la fecha en formato DD/MM/AAAA.');
    if(isValidISO(p.pubDate) && isValidISO(p.noPayImported) && ymOf(p.noPayImported) !== ymOf(noPayDate(p)))
      add('dateinc', 'critical', `La fecha "Desde no pago" informada (${fmtCL(p.noPayImported)}) no coincide con la calculada (${fmtCL(noPayDate(p))}).`, 'Verificar si la fecha venía en formato MM/DD/AAAA y corregir la fecha de publicación.');
    const dups = dupMap[norm(p.name) + '|' + norm(p.group)];
    if(dups.length > 1)
      add('dup', 'critical', `Posible duplicado: hay ${dups.length} registros con el mismo nombre e inmobiliaria.`, 'Revisar y archivar el registro repetido para no pagarlo dos veces.');
    if(si.code === 'CHARGE' && groupsWithClients.has(norm(p.group)))
      add('client', 'critical', `La inmobiliaria ${esc(p.group)} tiene proyectos marcados como cliente ${esc(c.counterpart)}, pero este proyecto se está incluyendo en el pago.`, `Confirmar con ${esc(c.counterpart)}. Si es cliente, cambiar a "Publicado, Cliente" o eliminar del cobro.`);
    if(si.code === 'CLIENT'){ const nt = norm(p.notes); if(/se paga/.test(nt) && !/no se paga/.test(nt))
      add('client', 'critical', `Está marcado como cliente ${esc(c.counterpart)}, pero su detalle indica que se paga.`, 'Corregir el detalle o el estado TOCTOC.'); }
  });
  const rev = state.alertReviews[P] || {};
  out.forEach(a => { const r = rev[a.key]; a.reviewed = !!(r && r.reviewed); a.comment = r ? (r.comment || '') : ''; a.reviewedAt = r ? r.date : null; });
  const order = {out:0, client:1, date:2, dateinc:3, dup:4, last:5};
  out.sort((a, b) => (a.reviewed - b.reviewed) || (order[a.type] - order[b.type]) || a.p.name.localeCompare(b.p.name, 'es'));
  return out;
}

/** Calcula la liquidación mensual del periodo */
function computeSettlement(P){
  const c = cfg(), s = getSet(P, false), rows = rowsFor(P);
  const chargeable = rows.filter(r => r.si.code === 'CHARGE');
  const incorporated = chargeable.filter(r => r.si.m === 1);
  const incorporatedAll = rows.filter(r => !r.p.archived && r.p.toctoc !== 'Pendiente' && isValidISO(r.p.pubDate) && ymOf(r.p.pubDate) === P);
  const outRows = rows.filter(r => r.si.code === 'OUT' || r.si.code === 'RB');
  const clientRows = rows.filter(r => r.si.code === 'CLIENT');
  const bUnit = (s.banner.unit != null && !isNaN(s.banner.unit)) ? s.banner.unit : c.bannerUF;
  const incFn = q => q >= c.incLimit ? c.incMaxUF : Math.min(q * c.incUnitUF, c.incMaxUF);
  const mk = (key, name, desc, unit, autoQty, src, totalFn) => {
    const billedQty = (src.billedQty == null || isNaN(src.billedQty)) ? autoQty : src.billedQty;
    const autoTotal = r4(totalFn(autoQty)), billedTotal = r4(totalFn(billedQty)), diff = r4(billedTotal - autoTotal);
    const obs = src.obs || '';
    const mismatch = billedQty !== autoQty || Math.abs(diff) > 1e-9;
    return {key, name, desc, unit, autoQty, billedQty, manual: src.billedQty != null, autoTotal, billedTotal, diff, obs,
      review: src.review || 'Pendiente', mismatch, needsJust: mismatch && !obs.trim()};
  };
  const items = [
    mk('banner', 'Actualización de banners', `Valor fijo mensual por actualización de banners de la landing${s.banner.active ? '' : ' (cobro desactivado este mes)'}.`, bUnit, s.banner.active ? 1 : 0, s.banner, q => q * bUnit),
    mk('leads', 'Envío de leads a inmobiliarias', `${fmtNum(c.leadUF)} UF por cada proyecto "Publicado, No cliente" dentro de sus ${c.maxMonths} meses de pago.`, c.leadUF, chargeable.length, s.leads, q => q * c.leadUF),
    mk('inc', 'Incorporación de proyectos en la landing', `${fmtNum(c.incUnitUF)} UF por proyecto incorporado en el mes (incluye clientes); tope ${fmtNum(c.incMaxUF)} UF hasta ${c.incLimit} proyectos.`, c.incUnitUF, incorporatedAll.length, s.inc, incFn)
  ];
  items[0].active = !!s.banner.active;
  const subAuto = r4(items.reduce((a, i) => a + i.autoTotal, 0));
  const subBilled = r4(items.reduce((a, i) => a + i.billedTotal, 0));
  const ivaPct = (s.ivaPct != null && !isNaN(s.ivaPct)) ? s.ivaPct : c.ivaPct;
  const iva = r4(subBilled * ivaPct / 100);
  const total = r4(subBilled + (s.ivaOn ? iva : 0));
  const diff = r4(subBilled - subAuto);
  const autoGeneral = items.some(i => i.review === 'Rechazado') ? 'Rechazado'
    : (Math.abs(diff) > 1e-9 || items.some(i => i.mismatch) || items.some(i => i.review !== 'Conforme')) ? 'Requiere revisión' : 'Conforme';
  return {P, items, chargeable, incorporated, incorporatedAll, outRows, clientRows, subAuto, subBilled, ivaPct, ivaOn: !!s.ivaOn,
    iva, total, diff, autoGeneral, general: s.generalStatus || autoGeneral, generalManual: !!s.generalStatus, obs: s.obs || '',
    incOverLimit: incorporatedAll.length > c.incLimit};
}
function snapRow(r){ return {id:r.p.id, name:r.p.name, group:r.p.group, toctoc:r.p.toctoc, pubDate:r.p.pubDate, noPay:noPayDate(r.p), m:r.si.m, payLabel:r.si.payLabel, billingLabel:r.si.billingLabel, notes:r.p.notes}; }
/** Fotografía inmutable del periodo al cerrar */
function buildSnapshot(P){
  const st = computeSettlement(P), rows = rowsFor(P);
  return {
    period:P, config:clone(cfg()),
    counts:{published: rows.filter(r => isPublishedIn(r, P)).length, chargeable: st.chargeable.length, out: st.outRows.length,
      clients: st.clientRows.length, incorporated: st.incorporated.length, incorporatedAll: st.incorporatedAll.length},
    chargeable: st.chargeable.map(snapRow), outList: st.outRows.map(snapRow), clientList: st.clientRows.map(snapRow),
    incorporatedList: st.incorporatedAll.map(snapRow),
    items: clone(st.items), subAuto: st.subAuto, subBilled: st.subBilled, ivaPct: st.ivaPct, ivaOn: st.ivaOn, iva: st.iva,
    total: st.total, diff: st.diff, general: st.general, obs: st.obs
  };
}
/** Validaciones previas al cierre */
function closeChecks(P){
  const alerts = computeAlerts(P), st = computeSettlement(P);
  const invalid = alerts.filter(a => a.type === 'date');
  const crit = alerts.filter(a => a.severity === 'critical' && a.type !== 'date' && !a.reviewed);
  const unjust = st.items.filter(i => i.needsJust);
  const unrev = st.items.filter(i => !i.review || i.review === 'Pendiente');
  const names = arr => arr.slice(0, 8).map(x => esc(x)).join(', ') + (arr.length > 8 ? '…' : '');
  return [
    {label:'No existen fechas inválidas o incompletas', ok: !invalid.length, detail: invalid.length ? `${invalid.length} proyecto(s): ${names(invalid.map(a => a.p.name))}` : ''},
    {label:'Alertas críticas revisadas', ok: !crit.length, detail: crit.length ? `${crit.length} alerta(s) sin revisar: ${names(crit.map(a => a.p.name))}` : ''},
    {label:'Diferencias entre cálculo y factura justificadas', ok: !unjust.length, detail: unjust.length ? 'Falta observación en: ' + names(unjust.map(i => i.name)) : ''},
    {label:'Todos los ítems tienen estado de revisión', ok: !unrev.length, detail: unrev.length ? 'Pendiente en: ' + names(unrev.map(i => i.name)) : ''},
    {label:'El periodo no ha sido cerrado anteriormente', ok: !state.closures[P], detail: state.closures[P] ? 'Cerrado el ' + fmtStamp(state.closures[P].closedAt) : ''}
  ];
}

   Pestaña "Carga proyectos" (proyectos) y "Pagos mensuales" (abril–septiembre 2026)

const EXCEL_PROJECTS = [

/** Carga los proyectos y los pagos históricos del Excel */
function seedDemo(){
  const now = nowStamp(), N = cfg().maxMonths;
  EXCEL_PROJECTS.forEach(([name, group, toctoc, pub, nopay, notes]) => {
    const p = {id:uid(), demo:false, source:EXCEL_SOURCE, archived:false, name, group, toctoc, pubDate:pub, landing:'Publicado', notes,
      noPayImported:nopay, billingRemoved:null, landingRemoved:null, billingHistory:[], createdAt:now, updatedAt:now};
    // Proyectos no cliente que ya cumplieron sus meses antes del mes actual: se registran como eliminados del cobro (según Excel)
    const removalPeriod = addMonths(ymOf(pub), N);
    if(toctoc === 'Publicado, No cliente' && removalPeriod < currentYM()){
      p.toctoc = 'Eliminado de pago';
      p.billingRemoved = {date:removalPeriod + '-01', period:removalPeriod, comment:'Cumplió 3 meses de pago (según ' + EXCEL_SOURCE + ')', prevStatus:'Publicado, No cliente', at:removalPeriod + '-01T00:00:00'};
    }
    state.projects.push(p);
  });
  // Cierres históricos con lo pagado (abril–septiembre)
  EXCEL_PAYMENTS.forEach(x => {
    if(state.closures[x.period]) return;
    const s = getSet(x.period, true);
    s.banner.billedQty = x.banner; s.banner.review = 'Conforme';
    s.leads.billedQty = x.leads; s.inc.billedQty = x.inc;
    let t = computeSettlement(x.period);
    const li = t.items[1], ii = t.items[2];
    s.leads.obs = x.leadsObs || (li.mismatch ? `Pagado según Excel: ${x.leads} proyectos. Cálculo por fechas: ${li.autoQty}. Revisar con ${cfg().counterpart}.` : 'Coincide con el cálculo.');
    s.inc.obs = x.incObs || (ii.mismatch ? `Pagado según Excel: ${x.inc} proyectos. Incorporados según fechas: ${ii.autoQty}. Revisar con ${cfg().counterpart}.` : 'Coincide con el cálculo.');
    s.leads.review = (li.mismatch && !x.leadsObs) ? 'Requiere revisión' : 'Conforme';
    s.inc.review = (ii.mismatch && !x.incObs) ? 'Requiere revisión' : 'Conforme';
    t = computeSettlement(x.period);
    s.generalStatus = t.items.some(i => i.review === 'Requiere revisión') ? 'Requiere revisión' : 'Conforme';
    s.obs = `Pago histórico cargado desde ${EXCEL_SOURCE} (pestaña "Pagos mensuales"). Total pagado: ${fmtNum(x.total)} UF.`;
    state.closures[x.period] = {id:uid(), period:x.period, closedAt:now, source:EXCEL_SOURCE,
      snapshot:Object.assign(buildSnapshot(x.period), {closeNote:'Cierre histórico cargado desde Excel'})};
  });
  addLog('Carga de datos base', `${EXCEL_PROJECTS.length} proyectos y ${EXCEL_PAYMENTS.length} meses pagados desde ${EXCEL_SOURCE}.`);
}

function toast(msg, type = 'info', ms = 4200){
  const icons = {success:'✔', error:'✖', warn:'⚠', info:'ℹ'};
  const el = document.createElement('div');
  el.className = 'toast ' + type;

  $('#toasts').appendChild(el);

}
const modalStack = [];
/** Modal genérico. buttons: [{label, cls, onClick(m)}] */
function openModal({title, body, size = '', buttons = [], onClose}){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true"><div class="modal-head"><h3></h3><button class="icon-btn" aria-label="Cerrar" data-x>✕</button></div><div class="modal-body"></div><div class="modal-foot"></div></div>`;
  $('#modalRoot').appendChild(back);
  const m = {
    el: back, body: back.querySelector('.modal-body'), foot: back.querySelector('.modal-foot'), closed:false,
    close(){ if(this.closed) return; this.closed = true; back.remove(); const i = modalStack.indexOf(this); if(i >= 0) modalStack.splice(i, 1); onClose && onClose(); },
    setTitle(t){ back.querySelector('.modal-head h3').textContent = t; },
    setBody(h){ this.body.innerHTML = h; this.body.scrollTop = 0; },
    setButtons(btns){
      this.foot.innerHTML = '';
      btns.forEach(b => { const bt = document.createElement('button'); bt.className = 'btn ' + (b.cls || 'btn-ghost'); bt.innerHTML = b.label; if(b.id) bt.id = b.id; if(b.disabled) bt.disabled = true; bt.onclick = () => b.onClick(m); this.foot.appendChild(bt); });
    }
  };
  m.setTitle(title); m.setBody(body); m.setButtons(buttons);
  back.querySelector('[data-x]').onclick = () => m.close();
  modalStack.push(m);
  return m;
}
/** Confirmación integrada. Devuelve Promise<{ok, value}> */
function confirmDialog({title, message, confirmLabel = 'Confirmar', danger = false, input = null, typeToConfirm = null}){
  return new Promise(resolve => {
    let done = false; const finish = r => { if(!done){ done = true; resolve(r); } };
    let body = `<div>${message}</div>`;
    if(input) body += `<div class="field" style="margin-top:12px"><label>${esc(input.label)}${input.required ? ' *' : ''}</label><textarea id="cdInput" rows="3" placeholder="${esc(input.placeholder || '')}">${esc(input.value || '')}</textarea><div class="err" id="cdErr"></div></div>`;
    if(typeToConfirm) body += `<div class="field" style="margin-top:12px"><label>Para confirmar escribe <b>${esc(typeToConfirm)}</b></label><input id="cdType" autocomplete="off"><div class="err" id="cdErr2"></div></div>`;
    openModal({title, body, onClose: () => finish({ok:false}), buttons:[
      {label:'Cancelar', onClick: m => m.close()},
      {label:confirmLabel, cls: danger ? 'btn-danger' : 'btn-primary', onClick: m => {
        const v = input ? m.el.querySelector('#cdInput').value.trim() : '';
        if(input && input.required && !v){ m.el.querySelector('#cdErr').textContent = 'Este campo es obligatorio.'; m.el.querySelector('#cdInput').classList.add('invalid'); return; }
        if(typeToConfirm && m.el.querySelector('#cdType').value.trim() !== typeToConfirm){ m.el.querySelector('#cdErr2').textContent = `Debes escribir exactamente ${typeToConfirm}.`; return; }
        finish({ok:true, value:v}); m.close();
      }}
    ]});
    setTimeout(() => { const f = document.querySelector('#cdInput, #cdType'); if(f) f.focus(); }, 50);
  });
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); });
/* Tooltips flotantes: cualquier elemento con data-tip */
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'); const tip = $('#tooltip');
  if(!t){ tip.style.display = 'none'; return; }
  tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
  const r = t.getBoundingClientRect();
  let x = r.left + r.width / 2 - tip.offsetWidth / 2; x = Math.max(8, Math.min(x, innerWidth - tip.offsetWidth - 8));
  let y = r.bottom + 8; if(y + tip.offsetHeight > innerHeight - 8) y = r.top - tip.offsetHeight - 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('scroll', () => { $('#tooltip').style.display = 'none'; }, true);
function info(text){ return `<i class="info" data-tip="${esc(text)}">i</i>`; }
function badge(text, cls){ return `<span class="badge b-${cls}">${esc(text)}</span>`; }
function emptyState(icon, title, text, btn = ''){ return `<div class="empty"><div class="big">${icon}</div><div style="font-weight:700;color:var(--navy)">${title}</div><div>${text}</div>${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`; }
function optionList(arr, sel, withEmpty){ return (withEmpty ? `<option value="">${esc(withEmpty)}</option>` : '') + arr.map(v => { const [val, lab] = Array.isArray(v) ? v : [v, v]; return `<option value="${esc(val)}" ${String(val) === String(sel) ? 'selected' : ''}>${esc(lab)}</option>`; }).join(''); }
