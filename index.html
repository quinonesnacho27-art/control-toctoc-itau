const BILLING_FILTERS = [
  ['cobrable_all', 'Cobrable (todos)'], ['cobrable', 'Cobrable (no último mes)'], ['ultimo', 'Cobrable · último mes'],
  ['eliminar', 'Eliminar del cobro'], ['cliente', 'No se cobra (cliente)'], ['eliminado', 'Eliminado del cobro'],
  ['landing', 'Fuera de landing'], ['pendiente', 'Pendiente'], ['noinicia', 'Aún no inicia'], ['fecha', 'Revisar fecha'], ['archivado', 'Archivado']
];
function billingKey(si){
  const N = cfg().maxMonths;
  return {CHARGE: si.m === N ? 'ultimo' : 'cobrable', OUT:'eliminar', CLIENT:'cliente', RB:'eliminado', RL:'landing', PEND:'pendiente', NS:'noinicia', INV:'fecha', ARC:'archivado'}[si.code];
}
function projectRowsFiltered(){
  const P = ui.period, f = ui.f;
  const alertIds = new Set(computeAlerts(P).filter(a => !a.reviewed).map(a => a.p.id));
  const q = norm(f.q);
  let rows = rowsFor(P).filter(r => {
    const p = r.p, bk = billingKey(r.si);
    if(p.archived && !f.archived && f.billing !== 'archivado') return false;
    if(q && !norm([p.name, p.group, p.toctoc, p.notes, p.landing, fmtCL(p.pubDate), r.si.payLabel, r.si.billingLabel].join(' ')).includes(q)) return false;
    if(f.group && norm(p.group) !== norm(f.group)) return false;
    if(f.toctoc && p.toctoc !== f.toctoc) return false;
    if(f.landing && p.landing !== f.landing) return false;
    if(f.billing){ if(f.billing === 'cobrable_all'){ if(r.si.code !== 'CHARGE') return false; } else if(bk !== f.billing) return false; }
    if(f.pay){
      if(f.pay === 'fuera'){ if(!['OUT','RB'].includes(r.si.code)) return false; }
      else if(!(r.si.code === 'CHARGE' && 'm' + r.si.m === f.pay)) return false;
    }
    if(f.alerts && !alertIds.has(p.id)) return false;
    return true;
  });
  const {key, dir} = ui.sort, k = dir === 'asc' ? 1 : -1;
  const val = r => ({name:norm(r.p.name), group:norm(r.p.group), toctoc:r.p.toctoc, pubDate:r.p.pubDate || '0000', noPay:r.p.pubDate || '0000', pay:(r.si.m || 0) + (r.si.code === 'CHARGE' ? 0 : 100), billing:r.si.billingLabel, landing:r.p.landing, notes:norm(r.p.notes)}[key] ?? '');
  rows.sort((a, b) => { const va = val(a), vb = val(b); return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es')) * k; });
  return {rows, alertIds};
}
function sortBy(key){ ui.sort = {key, dir: ui.sort.key === key && ui.sort.dir === 'asc' ? 'desc' : 'asc'}; renderProjTable(); }
function setF(k, v){ ui.f[k] = v; renderProjTable(); }
function clearFilters(){ ui.f = {q:'', group:'', toctoc:'', billing:'', landing:'', pay:'', alerts:false, archived:false}; renderProjects(); }
function renderProjects(){
  const c = cfg(), N = c.maxMonths, f = ui.f;
  const groups = [...new Set(state.projects.map(p => p.group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const payOpts = []; for(let m = 1; m <= N; m++) payOpts.push(['m' + m, `Mes ${m} de ${N}`]); payOpts.push(['fuera', 'Fuera de pago']);
  $('#main').innerHTML = `
  <div class="section-head"><div><h2>Control de proyectos</h2><div class="muted">Mes de control: <b>${periodLabel(ui.period)}</b> (cámbialo en el selector superior). Mes 1 = mes de publicación.</div></div>
    <div class="toolbar"><button class="btn btn-primary" onclick="openProjectForm()">＋ Nuevo proyecto</button><button class="btn btn-ghost" onclick="openImportCSV()">⇪ Importar CSV</button><button class="btn btn-ghost" onclick="exportProjectsCSV()">⇩ Exportar CSV</button></div></div>
  <div class="card">
    <div class="filters">
      <div class="field" style="grid-column:span 2"><label>Búsqueda libre</label><input id="fq" placeholder="Buscar por proyecto, inmobiliaria, detalle, fecha…" value="${esc(f.q)}" oninput="setF('q',this.value)"></div>
      <div class="field"><label>Mes de control</label>${periodPicker('fper', ui.period).replace('<div style="display:flex;gap:6px">', '<div style="display:flex;gap:6px" onchange="setPeriod(readPicker(\'fper\'))">')}</div>
      <div class="field"><label>Inmobiliaria o grupo</label><select onchange="setF('group',this.value)">${optionList(groups, f.group, 'Todas')}</select></div>
      <div class="field"><label>Estado TOCTOC</label><select onchange="setF('toctoc',this.value)">${optionList(TOCTOC_STATES, f.toctoc, 'Todos')}</select></div>
      <div class="field"><label>Estado de cobro</label><select onchange="setF('billing',this.value)">${optionList(BILLING_FILTERS, f.billing, 'Todos')}</select></div>
      <div class="field"><label>Estado en landing</label><select onchange="setF('landing',this.value)">${optionList(LANDING_STATES, f.landing, 'Todos')}</select></div>
      <div class="field"><label>Mes de pago</label><select onchange="setF('pay',this.value)">${optionList(payOpts, f.pay, 'Todos')}</select></div>
      <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" ${f.alerts ? 'checked' : ''} onchange="setF('alerts',this.checked)"> Solo con alertas pendientes</label></div>
      <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" ${f.archived ? 'checked' : ''} onchange="setF('archived',this.checked)"> Incluir archivados</label></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-ghost" onclick="clearFilters()">✕ Limpiar filtros</button></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px" class="small">
      ${badge('● Mes 1–' + (N - 1) + ': cobrable', 'green')} ${badge('● Mes ' + N + ': último mes', 'yellow')} ${badge('● Mes ' + (N + 1) + '+: eliminar del cobro', 'red')} ${badge('● Cliente ' + c.counterpart + ': no paga ' + c.payer, 'blue')} ${badge('● Eliminado / inactivo', 'gray')}
    </div>
    <div id="projCounter" class="counter"></div>
    <div id="projTable"></div>
  </div>`;
  renderProjTable();
}
function renderProjTable(){
  const {rows, alertIds} = projectRowsFiltered(), N = cfg().maxMonths;
  const totalActive = state.projects.filter(p => !p.archived).length;
  $('#projCounter').innerHTML = `Mostrando <b>${rows.length}</b> de <b>${totalActive}</b> proyectos activos${state.projects.length - totalActive ? ` (${state.projects.length - totalActive} archivados)` : ''}.`;
  if(!state.projects.length){ $('#projTable').innerHTML = emptyState('🏢', 'Aún no hay proyectos', 'Crea un proyecto o importa un CSV para comenzar.', '<button class="btn btn-primary" onclick="openProjectForm()">＋ Nuevo proyecto</button>'); return; }
  if(!rows.length){ $('#projTable').innerHTML = emptyState('🔍', 'Sin resultados', 'Ningún proyecto coincide con los filtros aplicados.', '<button class="btn btn-ghost" onclick="clearFilters()">Limpiar filtros</button>'); return; }
  const th = (key, label, tip) => `<th class="${key ? 'sortable' : ''}" ${key ? `onclick="sortBy('${key}')"` : ''} ${tip ? `data-tip="${esc(tip)}"` : ''}>${label}${key && ui.sort.key === key ? `<span class="arrow">${ui.sort.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;
  const monthHeads = Array.from({length:N}, (_, i) => th('', `Mes ${i + 1}`, `Periodo ${i + 1} de pago (el mes de publicación cuenta como mes 1).`)).join('');
  const alertsAll = computeAlerts(ui.period);
  const body = rows.map(r => {
    const p = r.p, si = r.si, months = payMonths(p);
    const al = alertsAll.filter(a => a.p.id === p.id && !a.reviewed);
    const alertIcon = al.length ? ` <span class="badge b-red" data-tip="${esc(al.map(a => a.reason.replace(/<[^>]+>/g, '')).join(' · '))}">⚠ ${al.length}</span>` : '';
    const monthCells = Array.from({length:N}, (_, i) => `<td class="nowrap">${months[i] ? (months[i] === ui.period ? `<b style="color:var(--orange)">${periodShort(months[i])}</b>` : periodShort(months[i])) : '—'}</td>`).join('');
    const landingTxt = p.landing === 'Eliminado de landing' ? badge('Eliminado de landing', 'gray') + (p.landingRemoved ? `<div class="small muted">desde ${periodShort(p.landingRemoved.period)}</div>` : '') : badge(p.landing, p.landing === 'Publicado' ? 'navy' : 'orange');
    const removedInfo = p.billingRemoved ? `<div class="small muted">desde ${periodShort(p.billingRemoved.period)} (${fmtCL(p.billingRemoved.date)})</div>` : '';
    const acts = [
      `<button class="icon-btn" data-tip="Editar" onclick="openProjectForm('${p.id}','edit')">✎</button>`,
      `<button class="icon-btn" data-tip="Duplicar registro" onclick="openProjectForm('${p.id}','dup')">⧉</button>`,
      p.toctoc === 'Eliminado de pago'
        ? `<button class="icon-btn" data-tip="Restaurar al cobro" onclick="restoreBilling('${p.id}')">↺</button>`
        : (!p.archived ? `<button class="icon-btn warn" data-tip="Marcar como eliminado del cobro (no borra el registro)" onclick="askRemoveBilling(['${p.id}'])">⊘</button>` : ''),
      p.archived
        ? `<button class="icon-btn" data-tip="Desarchivar" onclick="toggleArchive('${p.id}')">⇧</button><button class="icon-btn danger" data-tip="Eliminar definitivamente (requiere doble confirmación)" onclick="deleteProject('${p.id}')">🗑</button>`
        : `<button class="icon-btn" data-tip="Archivar (se conserva en historial)" onclick="toggleArchive('${p.id}')">🗄</button>`
    ].join('');
    return `<tr class="r-${si.cls}">
      <td class="name-cell">${esc(p.name)}${alertIcon}${p.demo ? ' <span class="badge b-gray" data-tip="Registro de demostración">demo</span>' : ''}</td>
      <td>${esc(p.group) || '—'}</td>
      <td>${badge(p.toctoc, p.toctoc === 'Publicado, Cliente' ? 'blue' : p.toctoc === 'Publicado, No cliente' ? 'navy' : 'gray')}</td>
      <td class="nowrap">${p.pubDate ? (isValidISO(p.pubDate) ? fmtCL(p.pubDate) : badge('Inválida', 'red')) : badge('Incompleta', 'red')}</td>
      ${monthCells}
      <td class="nowrap">${fmtCL(noPayDate(p))}</td>
      <td>${badge(si.payLabel, si.cls)}</td>
      <td>${badge(si.billingLabel, si.cls)}${removedInfo}</td>
      <td>${landingTxt}</td>
      <td class="notes-cell">${esc(p.notes)}</td>
      <td><div class="actions">${acts}</div></td></tr>`;
  }).join('');
  $('#projTable').innerHTML = `<div class="table-wrap tall"><table class="data"><thead><tr>
    ${th('name', 'Proyecto')}${th('group', 'Inmobiliaria / grupo')}${th('toctoc', 'Estado TOCTOC', 'Estado comercial del proyecto con TOCTOC.')}${th('pubDate', 'Fecha publicación', 'Formato DD/MM/AAAA.')}
    ${monthHeads}${th('noPay', 'No pagar desde', 'Inicio del mes ' + (N + 1) + ': desde esta fecha no corresponde pagar.')}${th('pay', 'Mes de pago', 'Mes de pago en el periodo seleccionado.')}
    ${th('billing', 'Estado de cobro')}${th('landing', 'Estado en landing')}${th('notes', 'Detalle / observación')}${th('', 'Acciones')}
  </tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- Acciones sobre proyectos ---------- */
/** Elimina del cobro (no borra el registro): guarda fecha de acción y periodo */
function removeFromBilling(ids, comment){
  let n = 0;
  ids.forEach(id => {
    const p = findP(id); if(!p || p.toctoc === 'Eliminado de pago') return;
    p.billingRemoved = {date:todayISO(), period:ui.period, comment:comment || '', prevStatus:p.toctoc === 'Eliminado de landing' ? (p.landingRemoved && p.landingRemoved.prevStatus) || 'Publicado, No cliente' : p.toctoc, at:nowStamp()};
    p.toctoc = 'Eliminado de pago'; p.updatedAt = nowStamp(); n++;
    addLog('Eliminado del cobro', `${p.name} (${p.group}) · periodo ${periodLabel(ui.period)}${comment ? ' · ' + comment : ''}`);
  });
  if(n){ save(); toast(`${n} proyecto(s) marcados como eliminados del cobro. Se conservan en el historial.`, 'success'); }
  renderAll();
}
function askRemoveBilling(ids, presetComment){
  const ps = ids.map(findP).filter(Boolean);
  const anyChargeable = ps.some(p => statusInfo(p, ui.period).code === 'CHARGE');
  confirmDialog({
    title:'Eliminar del cobro',
    message:`<p>Se marcará${ps.length > 1 ? 'n' : ''} <b>${ps.length}</b> proyecto(s) como <b>eliminado del cobro</b> desde <b>${periodLabel(ui.period)}</b>:</p><ul>${ps.slice(0, 12).map(p => `<li>${esc(p.name)} · ${esc(p.group)}</li>`).join('')}${ps.length > 12 ? '<li>…</li>' : ''}</ul>
      <div class="notice n-info"><span class="ic">ℹ</span><div>El registro <b>no se borra</b>: queda fuera del cálculo desde este periodo y se conserva en el historial. Esto es distinto de "eliminar de la landing".</div></div>
      ${anyChargeable ? '<div class="notice n-warn"><span class="ic">⚠</span><div>Al menos un proyecto aún está dentro de sus meses de pago. Si lo eliminas, dejará de cobrarse desde este periodo.</div></div>' : ''}`,
    confirmLabel:'Eliminar del cobro', danger:true, input:{label:'Comentario (opcional)', value:presetComment || ''}
  }).then(r => { if(r.ok) removeFromBilling(ids, r.value); });
}
function restoreBilling(id){
  const p = findP(id); if(!p) return;
  confirmDialog({title:'Restaurar al cobro', message:`<p>¿Restaurar <b>${esc(p.name)}</b> a su estado anterior (<b>${esc(p.billingRemoved ? p.billingRemoved.prevStatus : 'Publicado, No cliente')}</b>)? La eliminación anterior quedará registrada en el historial.</p>`, input:{label:'Motivo', required:true}, confirmLabel:'Restaurar'})
  .then(r => { if(!r.ok) return;
    const prev = p.billingRemoved ? p.billingRemoved.prevStatus : 'Publicado, No cliente';
    if(p.billingRemoved) p.billingHistory.push(Object.assign({}, p.billingRemoved, {restoredAt:nowStamp(), restoreReason:r.value}));
    p.billingRemoved = null; p.toctoc = prev || 'Publicado, No cliente'; p.updatedAt = nowStamp();
    addLog('Restaurado al cobro', `${p.name} · ${r.value}`); save(); toast('Proyecto restaurado al cobro.', 'success'); renderAll(); });
}
function toggleArchive(id){
  const p = findP(id); if(!p) return;
  if(p.archived){ p.archived = false; p.updatedAt = nowStamp(); addLog('Desarchivado', p.name); save(); toast('Proyecto desarchivado.', 'success'); renderAll(); return; }
  confirmDialog({title:'Archivar proyecto', message:`<p>¿Archivar <b>${esc(p.name)}</b>? Quedará fuera de cálculos y alertas, pero se conserva y puedes verlo con el filtro "Incluir archivados".</p>`, confirmLabel:'Archivar'})
  .then(r => { if(!r.ok) return; p.archived = true; p.archivedAt = nowStamp(); addLog('Archivado', p.name); save(); toast('Proyecto archivado.', 'success'); renderAll(); });
}
async function deleteProject(id){
  const p = findP(id); if(!p) return;
  const r1 = await confirmDialog({title:'Eliminar definitivamente', message:`<div class="notice n-error"><span class="ic">⚠</span><div>Vas a borrar físicamente <b>${esc(p.name)}</b>. Esta acción no se puede deshacer. Los cierres mensuales ya realizados no cambian.</div></div>`, confirmLabel:'Continuar', danger:true});
  if(!r1.ok) return;
  const r2 = await confirmDialog({title:'Confirmación final', message:'<p>Confirma la eliminación definitiva del registro.</p>', confirmLabel:'Eliminar definitivamente', danger:true, typeToConfirm:'ELIMINAR'});
  if(!r2.ok) return;
  state.projects = state.projects.filter(x => x.id !== id);
  addLog('Eliminación definitiva', `${p.name} (${p.group})`); save(); toast('Registro eliminado definitivamente.', 'success'); renderAll();
}

/* =========================================================
   10. MÓDULO 6 · FORMULARIO DE PROYECTOS
   ========================================================= */
let formCtx = null;
function openProjectForm(id, mode = 'new'){
  const src = id ? findP(id) : null;
  const p = src ? clone(src) : {name:'', group:'', toctoc:'Publicado, No cliente', pubDate:'', landing:'Publicado', notes:''};
  if(mode === 'dup'){ p.name = p.name + ' (copia)'; p.billingRemoved = null; p.landingRemoved = null; if(p.toctoc === 'Eliminado de pago') p.toctoc = 'Publicado, No cliente'; }
  formCtx = {id: mode === 'edit' ? id : null, mode, data:null};
  const groups = [...new Set(state.projects.map(x => x.group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const title = mode === 'edit' ? 'Editar proyecto' : mode === 'dup' ? 'Duplicar proyecto' : 'Nuevo proyecto';
  const landPeriod = p.landingRemoved ? p.landingRemoved.period : ui.period;
  const body = `<div class="form-grid">
    <div class="field full"><label>Nombre o identificación del proyecto *</label><input id="fName" value="${esc(p.name)}" oninput="formPreview()" maxlength="160"><div class="err" id="eName"></div></div>
    <div class="field"><label>Inmobiliaria o grupo *</label><input id="fGroup" list="dlGroups" value="${esc(p.group)}" oninput="formPreview()" maxlength="100"><datalist id="dlGroups">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist><div class="err" id="eGroup"></div></div>
    <div class="field"><label>Estado TOCTOC * ${info('Publicado, No cliente: se paga hasta ' + cfg().maxMonths + ' meses. Publicado, Cliente: nunca se cobra a ' + cfg().payer + '.')}</label><select id="fToctoc" onchange="formSync('toctoc')">${optionList(TOCTOC_STATES, p.toctoc)}</select></div>
    <div class="field"><label>Fecha de publicación (DD/MM/AAAA) ${info('Se interpreta siempre como día/mes/año. Ej.: 15/07/2026 = 15 de julio de 2026.')}</label><input id="fDate" placeholder="DD/MM/AAAA" value="${esc(isValidISO(p.pubDate) ? fmtCL(p.pubDate) : (p.pubDate || ''))}" oninput="formPreview()" onblur="autoFormatDate(this)" maxlength="10" inputmode="numeric"><div class="err" id="eDate"></div></div>
    <div class="field"><label>Estado en landing ${info('"Eliminado de landing" significa que el proyecto ya no se muestra. Es distinto de "Eliminado del cobro".')}</label><select id="fLanding" onchange="formSync('landing')">${optionList(LANDING_STATES, p.landing)}</select></div>
    <div class="field ${p.landing === 'Eliminado de landing' || p.toctoc === 'Eliminado de landing' ? '' : 'hidden'}" id="wrapLand"><label>Periodo desde el que salió de la landing</label>${periodPicker('fLand', landPeriod)}</div>
    <div class="field full"><label>Observaciones / detalle</label><textarea id="fNotes" rows="2" maxlength="500">${esc(p.notes)}</textarea></div>
  </div>
  <div class="preview-box" id="fPreview"></div>`;
  openModal({title, body, size:'md', buttons:[
    {label:'Cancelar', onClick: m => m.close()},
    {label:'Revisar y guardar →', cls:'btn-primary', onClick: m => formReview(m)}
  ]});
  formPreview();

function validateForm(d){
  const errors = {}, warnings = [];
  if(!d.name) errors.name = 'El nombre del proyecto es obligatorio.';
  if(!d.group) errors.group = 'La inmobiliaria o grupo es obligatoria (usa "SIN GRUPO" si no aplica).';
  let iso = '';
  if(d.dateRaw){ iso = parseCLStrict(d.dateRaw); if(!iso) errors.date = 'Fecha inválida. Usa DD/MM/AAAA, por ejemplo 15/07/2026.'; }
  else if(d.toctoc !== 'Pendiente') warnings.push('No tiene fecha de publicación: quedará con alerta de "fecha incompleta" y bloqueará el cierre de mes.');
  const others = state.projects.filter(x => x.id !== formCtx.id);
  const sameNG = others.filter(x => norm(x.name) === norm(d.name) && norm(x.group) === norm(d.group));
  const sameN = others.filter(x => norm(x.name) === norm(d.name) && norm(x.group) !== norm(d.group));
  if(d.name && sameNG.length) warnings.push(`<b>Posible duplicado:</b> ya existe${sameNG.length > 1 ? 'n' : ''} ${sameNG.length} proyecto(s) con el mismo nombre e inmobiliaria (${sameNG.map(x => fmtCL(x.pubDate)).join(', ')}).`);
  if(d.name && sameN.length) warnings.push(`Ya existe un proyecto con el mismo nombre en otra inmobiliaria: ${sameN.map(x => esc(x.group)).join(', ')}.`);
  if(iso && iso > addMonths(currentYM(), 12) + '-01') warnings.push('La fecha de publicación está a más de 12 meses en el futuro.');
  return {errors, warnings, iso};
}

function saveProject(){
  const d = formCtx.data, iso = formCtx.iso, isNew = !formCtx.id;
  const p = isNew ? {id:uid(), createdAt:nowStamp(), demo:false, archived:false, billingRemoved:null, landingRemoved:null, billingHistory:[], noPayImported:''} : findP(formCtx.id);
  const prevToctoc = isNew ? null : p.toctoc;
  // Transiciones de "eliminado del cobro"
  if(d.toctoc === 'Eliminado de pago' && prevToctoc !== 'Eliminado de pago')
    p.billingRemoved = {date:todayISO(), period:ui.period, comment:'Cambio de estado desde el formulario', prevStatus: prevToctoc && prevToctoc !== 'Eliminado de landing' ? prevToctoc : 'Publicado, No cliente', at:nowStamp()};
  if(prevToctoc === 'Eliminado de pago' && d.toctoc !== 'Eliminado de pago' && p.billingRemoved){
    p.billingHistory.push(Object.assign({}, p.billingRemoved, {restoredAt:nowStamp(), restoreReason:'Cambio de estado desde el formulario'})); p.billingRemoved = null; }
  // Transiciones de "eliminado de landing"
  if(d.landing === 'Eliminado de landing'){
    const prevForLanding = d.toctoc === 'Eliminado de landing'
      ? (prevToctoc && prevToctoc !== 'Eliminado de landing' && prevToctoc !== 'Eliminado de pago' ? prevToctoc : (p.landingRemoved && p.landingRemoved.prevStatus) || 'Publicado, No cliente')
      : d.toctoc;
    p.landingRemoved = {period:d.landPeriod, date:(p.landingRemoved && p.landingRemoved.date) || todayISO(), prevStatus:prevForLanding};
  } else p.landingRemoved = null;
  if(iso !== p.pubDate && p.noPayImported && iso) p.noPayImported = ''; // si se corrige la fecha, se descarta la fecha importada
  Object.assign(p, {name:d.name, group:d.group, toctoc:d.toctoc, pubDate:iso, landing:d.landing, notes:d.notes, updatedAt:nowStamp()});
  if(isNew) state.projects.push(p);
  addLog(isNew ? (formCtx.mode === 'dup' ? 'Proyecto duplicado' : 'Proyecto creado') : 'Proyecto editado', `${p.name} (${p.group})`);
  save(); toast(isNew ? 'Proyecto guardado correctamente.' : 'Cambios guardados.', 'success'); renderAll();
}

function renderLiquidation(){
  const P = ui.period, c = cfg(), closed = state.closures[P];
  if(closed){
    const s = closed.snapshot;
    $('#main').innerHTML = `
    <div class="section-head"><div><h2>Liquidación mensual ${esc(c.counterpart)} · ${periodLabel(P)}</h2><div class="muted">Fotografía del cierre: no cambia aunque se editen proyectos posteriormente.</div></div>
      <div class="toolbar">${badge('Mes cerrado el ' + fmtStamp(closed.closedAt), 'green')}<button class="btn btn-ghost" onclick="exportSettlementCSV('${P}')">⇩ Exportar CSV</button><button class="btn btn-ghost" onclick="viewClosure('${closed.id}')">👁 Ver cierre completo</button><button class="btn btn-danger" onclick="reopenMonth('${P}')">↺ Reabrir mes</button></div></div>
    <div class="notice n-success"><span class="ic">🔒</span><div>Periodo cerrado. Para modificar la liquidación debes reabrir el mes registrando el motivo.</div></div>
    <div class="card">${liqTable(s.items, false)}${liqTotals({subAuto:s.subAuto, subBilled:s.subBilled, ivaPct:s.ivaPct, ivaOn:s.ivaOn, iva:s.iva, total:s.total, diff:s.diff, general:s.general}, false)}
      <div style="margin-top:12px"><b>Observaciones generales:</b> ${esc(s.obs) || '—'}${s.closeNote ? `<br><b>Nota de cierre:</b> ${esc(s.closeNote)}` : ''}</div>
      ${projList(s.chargeable, 'Proyectos cobrables (base de leads)')}${projList(s.incorporatedList, 'Proyectos incorporados en el mes')}${projList(s.outList, 'Proyectos fuera de pago')}${projList(s.clientList, 'Proyectos clientes ' + c.counterpart)}
    </div>`;
    return;
  }
  const t = computeSettlement(P);
  const leads = t.items[1], inc = t.items[2];
  const warns = [];
  if(leads.billedQty !== leads.autoQty) warns.push(['error', `<b>Leads:</b> la cantidad automática (${fmtNum(leads.autoQty)} proyectos cobrables) no coincide con la cantidad facturada (${fmtNum(leads.billedQty)}).`]);
  if(t.incOverLimit) warns.push(['warn', `<b>Incorporación:</b> se incorporaron ${t.incorporatedAll.length} proyectos, sobre el límite de ${c.incLimit}. Se mantiene el tope de ${fmtUF(c.incMaxUF)}; revisar condición contractual antes de aceptar un cobro adicional.`]);
  if(inc.billedQty !== inc.autoQty) warns.push(['warn', `<b>Incorporación:</b> la cantidad facturada (${fmtNum(inc.billedQty)}) difiere de la automática (${fmtNum(inc.autoQty)}).`]);
  t.items.filter(i => i.needsJust).forEach(i => warns.push(['error', `<b>${esc(i.name)}:</b> hay diferencia y falta la observación que la justifique.`]));
  const outN = t.outRows.filter(r => r.si.code === 'OUT').length;
  if(outN) warns.push(['error', `${outN} proyecto(s) en mes ${c.maxMonths + 1}+ quedan fuera del cálculo. Verifica que no vengan en la factura.`]);
  $('#main').innerHTML = `
  <div class="section-head"><div><h2>Liquidación mensual ${esc(c.counterpart)} · ${periodLabel(P)}</h2><div class="muted">Cálculo automático según proyectos del periodo. Ingresa la cantidad facturada solo si la factura difiere.</div></div>
    <div class="toolbar">${badge('Mes abierto', 'orange')}<button class="btn btn-ghost" onclick="exportSettlementCSV('${P}')">⇩ Exportar CSV</button><button class="btn btn-navy" onclick="openCloseMonth()">🔒 Cerrar mes</button></div></div>
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi orange" onclick="dashGo({billing:'cobrable_all'})"><div class="k-label">Proyectos cobrables ${info('Base para leads: Publicado, No cliente dentro de sus meses de pago. Excluye clientes, fuera de periodo y eliminados del cobro.')}</div><div class="k-value">${t.chargeable.length}</div><div class="k-sub">× ${fmtNum(c.leadUF)} UF = ${fmtUF(leads.autoTotal)}</div></div>
    <div class="kpi green" onclick="dashGo({pay:'m1'})"><div class="k-label">Incorporados en el mes ${info('Proyectos cargados en la landing con fecha de publicación en el periodo (incluye clientes).')}</div><div class="k-value">${t.incorporatedAll.length}</div><div class="k-sub">${t.incorporated.length} no clientes · ${fmtUF(inc.autoTotal)}</div></div>
    <div class="kpi blue" onclick="dashGo({billing:'cliente'})"><div class="k-label">Clientes (no se pagan)</div><div class="k-value">${t.clientRows.length}</div><div class="k-sub">Excluidos del cálculo</div></div>
    <div class="kpi red" onclick="dashGo({pay:'fuera'})"><div class="k-label">Fuera de pago</div><div class="k-value">${t.outRows.length}</div><div class="k-sub">Mes ${c.maxMonths + 1}+ o eliminados del cobro</div></div>
  </div>
  ${warns.map(([k, w]) => `<div class="notice n-${k}"><span class="ic">${k === 'error' ? '⚠' : '⚠'}</span><div>${w}</div></div>`).join('')}
  <div class="card">${liqTable(t.items, true)}${liqTotals(t, true)}
    <div class="field" style="margin-top:14px"><label>Observaciones generales de la liquidación</label><textarea rows="2" onchange="liqSetGlobal('obs',this.value)" placeholder="Ej.: factura N°…, acuerdos con ${esc(c.counterpart)}…">${esc(t.obs)}</textarea></div>
    ${projList(t.chargeable.map(snapRow), 'Proyectos cobrables (base de leads)')}${projList(t.incorporatedAll.map(snapRow), 'Proyectos incorporados en el mes')}${projList(t.outRows.map(snapRow), 'Proyectos fuera de pago')}${projList(t.clientRows.map(snapRow), 'Proyectos clientes ' + c.counterpart)}
  </div>`;
}

function openCloseMonth(){
  const P = ui.period, checks = closeChecks(P), ok = checks.every(c => c.ok), t = computeSettlement(P);
  const body = `<p>Validaciones previas al cierre de <b>${periodLabel(P)}</b>:</p>
    <ul class="check-list">${checks.map(c => `<li class="${c.ok ? 'ok' : 'fail'}"><span class="ic">${c.ok ? '✔' : '✖'}</span><div><b>${c.label}</b>${c.detail ? `<div class="small">${c.detail}</div>` : ''}</div></li>`).join('')}</ul>
    ${ok ? `<div class="totals"><div class="total-box"><span>Total calculado</span><b>${fmtUF(t.subAuto)}</b></div><div class="total-box"><span>Total facturado</span><b>${fmtUF(t.subBilled)}</b></div><div class="total-box"><span>Diferencia</span><b>${fmtDiff(t.diff)}</b></div><div class="total-box"><span>Estado general</span><b style="font-size:15px">${esc(t.general)}</b></div></div>
      <div class="field" style="margin-top:12px"><label>Nota de cierre (opcional)</label><textarea id="closeNote" rows="2"></textarea></div>
      <div class="notice n-info"><span class="ic">ℹ</span><div>Se guardará una fotografía del periodo. Las ediciones posteriores de proyectos no modificarán este cierre.</div></div>`
    : `<div class="notice n-error"><span class="ic">⚠</span><div>Corrige los puntos marcados antes de cerrar el mes.</div></div>`}`;
  const buttons = [{label:'Cancelar', onClick: m => m.close()}];
  if(!ok){
    buttons.push({label:'Ir a alertas', onClick: m => { m.close(); goTab('alerts'); }});
  } else buttons.push({label:'🔒 Confirmar cierre del mes', cls:'btn-navy', onClick: m => { const note = $('#closeNote').value.trim(); m.close(); doCloseMonth(P, note); }});
  openModal({title:'Cerrar mes', body, size:'md', buttons});
}
function doCloseMonth(P, note){
  if(state.closures[P]){ toast('Este periodo ya fue cerrado.', 'error'); return; }
  const snapshot = Object.assign(buildSnapshot(P), {closeNote:note || ''});
  state.closures[P] = {id:uid(), period:P, closedAt:nowStamp(), snapshot};
  addLog('Cierre de mes', `${periodLabel(P)} · facturado ${fmtUF(snapshot.subBilled)}`);
  save(); toast(`Mes ${periodLabel(P)} cerrado correctamente.`, 'success'); renderAll();
}
function reopenMonth(P){
  const cl = state.closures[P]; if(!cl) return;
  confirmDialog({title:'Reabrir mes', danger:true, confirmLabel:'Reabrir mes',
    message:`<div class="notice n-warn"><span class="ic">⚠</span><div>Vas a reabrir <b>${periodLabel(P)}</b>, cerrado el ${fmtStamp(cl.closedAt)}. El cierre original se conservará en el historial como versión "Reabierta", y la liquidación volverá a ser editable con los datos actuales.</div></div>`,
    input:{label:'Motivo de la reapertura', required:true, placeholder:'Ej.: factura corregida por TOCTOC'}, typeToConfirm:'REABRIR'})
  .then(r => { if(!r.ok) return;
    state.closureArchive.push(Object.assign(clone(cl), {reopenedAt:nowStamp(), reopenReason:r.value}));
    delete state.closures[P];
    addLog('Reapertura de mes', `${periodLabel(P)} · ${r.value}`); save(); toast('Mes reabierto. El cierre anterior quedó en el historial.', 'success'); renderAll(); });
}
function allClosures(){
  return [...Object.values(state.closures).map(c => Object.assign({active:true}, c)), ...state.closureArchive.map(c => Object.assign({active:false}, c))]
    .sort((a, b) => b.period.localeCompare(a.period) || String(b.closedAt).localeCompare(String(a.closedAt)));
}

function saveConfig(){
  const num = (id, label, {int = false, min = 0} = {}) => { const v = parseNum($('#' + id).value); if(isNaN(v) || v < min || (int && !Number.isInteger(v))){ throw new Error(`${label}: valor inválido.`); } return v; };
  try {
    const n = {bannerUF:num('cBanner', 'UF banners'), leadUF:num('cLead', 'UF leads'), incUnitUF:num('cIncUnit', 'UF por incorporación'), incMaxUF:num('cIncMax', 'UF máxima'),
      incLimit:num('cIncLimit', 'Proyectos incluidos', {int:true, min:1}), maxMonths:num('cMonths', 'Meses pagados', {int:true, min:1}), ivaPct:num('cIva', 'IVA')};
    if(n.maxMonths > 24) throw new Error('Máximo de meses pagados: usa un valor entre 1 y 24.');
    n.currency = $('#cCurrency').value.trim() || 'UF'; n.counterpart = $('#cCounter').value.trim() || 'TOCTOC'; n.payer = $('#cPayer').value.trim() || 'Itaú';
    n.defaultPeriod = $('#cDefAuto').checked ? '' : readPicker('cDef');
    Object.assign(state.config, n); addLog('Configuración actualizada', JSON.stringify(n)); save(); toast('Configuración guardada.', 'success'); renderAll();
  } catch(e){ toast(e.message, 'error'); }
}
function resetConfig(){
  confirmDialog({title:'Restablecer configuración', message:'<p>¿Volver a los valores iniciales (banners 20 UF, leads 0,5 UF, incorporación 1 UF hasta 20 UF / 20 proyectos, 3 meses)?</p>', confirmLabel:'Restablecer'})
  .then(r => { if(!r.ok) return; state.config = defaultConfig(); addLog('Configuración restablecida', ''); save(); toast('Valores iniciales restablecidos.', 'success'); renderAll(); });
}
function removeDemo(){
  confirmDialog({title:'Eliminar datos de demostración', message:'<p>Se eliminarán los proyectos de ejemplo y el cierre de demostración. Tus registros reales no se modifican.</p>', confirmLabel:'Eliminar demo', danger:true})
  .then(r => { if(!r.ok) return;
    const n = state.projects.filter(p => p.demo).length;
    state.projects = state.projects.filter(p => !p.demo);
    Object.keys(state.closures).forEach(k => { if(state.closures[k].demo){ delete state.closures[k]; if(state.settlements[k] && state.settlements[k].demo) delete state.settlements[k]; } });
    state.closureArchive = state.closureArchive.filter(c => !c.demo);
    addLog('Demo eliminada', `${n} proyectos de ejemplo eliminados`); save(); toast('Datos de demostración eliminados.', 'success'); renderAll(); });
}

function toCSV(rows){ return '\uFEFF' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
function download(name, content, type = 'text/csv;charset=utf-8'){
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function stampFile(){ const s = nowStamp(); return s.slice(0, 10).replace(/-/g, '') + '_' + s.slice(11, 16).replace(':', ''); }
function exportProjectsCSV(){
  const N = cfg().maxMonths, P = ui.period;
  const head = ['IDENTIFICACIÓN PROYECTO', 'Grupo', 'Estado TOC TOC', 'Fecha Publicación', 'Desde Fecha No Pago', 'Detalle', 'Estado landing'];
  for(let i = 1; i <= N; i++) head.push('Mes ' + i);
  head.push(`Mes de pago (${periodLabel(P)})`, `Estado de cobro (${periodLabel(P)})`, 'Fecha eliminación cobro', 'Periodo eliminación cobro', 'Archivado');
  const rows = state.projects.map(p => { const si = statusInfo(p, P), ms = payMonths(p);
    const r = [p.name, p.group, p.toctoc, isValidISO(p.pubDate) ? fmtCL(p.pubDate) : p.pubDate, fmtCL(noPayDate(p)).replace('—', ''), p.notes, p.landing];
    for(let i = 0; i < N; i++) r.push(ms[i] ? periodShort(ms[i]) : '');
    r.push(si.payLabel, si.billingLabel, p.billingRemoved ? fmtCL(p.billingRemoved.date) : '', p.billingRemoved ? periodLabel(p.billingRemoved.period) : '', p.archived ? 'Sí' : 'No');
    return r; });
  download(`Proyectos_${cfg().counterpart}_${stampFile()}.csv`, toCSV([head, ...rows]));
  toast(`Exportados ${rows.length} proyectos.`, 'success');
}
function settlementRows(P, s){
  const rows = [[`Liquidación mensual ${cfg().counterpart} - ${periodLabel(P)}`], [s.closedAt ? 'Cerrado el ' + fmtStamp(s.closedAt) : 'Periodo abierto (cálculo en línea)'], [],
    ['Ítem', 'Descripción', 'Valor unitario (UF)', 'Cantidad automática', 'Cantidad facturada', 'Total automático (UF)', 'Total facturado (UF)', 'Diferencia (UF)', 'Observación', 'Estado de revisión']];
  s.items.forEach(i => rows.push([i.name, i.desc, fmtNum(i.unit), fmtNum(i.autoQty), fmtNum(i.billedQty), fmtNum(i.autoTotal), fmtNum(i.billedTotal), fmtNum(i.diff), i.obs, i.review]));
  rows.push([], ['Subtotal automático (UF)', fmtNum(s.subAuto)], ['Subtotal facturado (UF)', fmtNum(s.subBilled)], [`IVA informativo ${fmtNum(s.ivaPct)}%`, s.ivaOn ? fmtNum(s.iva) : 'No aplicado'],
    ['Total final (UF)', fmtNum(s.total)], ['Diferencia cálculo vs factura (UF)', fmtNum(s.diff)], ['Estado general', s.general], ['Observaciones', s.obs || '']);
  rows.push([], ['Proyectos cobrables'], ['Proyecto', 'Grupo', 'Fecha Publicación', 'Mes de pago']);
  (s.chargeableList || []).forEach(r => rows.push([r.name, r.group, fmtCL(r.pubDate), r.payLabel]));
  return rows;
}
function exportSettlementCSV(P){
  const cl = state.closures[P];
  let s;
  if(cl) s = Object.assign({}, cl.snapshot, {closedAt:cl.closedAt, chargeableList:cl.snapshot.chargeable});

}
function exportClosureCSV(cl){ if(!cl) return; const s = Object.assign({}, cl.snapshot, {closedAt:cl.closedAt, chargeableList:cl.snapshot.chargeable}); download(`Cierre_${cfg().counterpart}_${cl.period}${cl.active ? '' : '_reabierto'}.csv`, toCSV(settlementRows(cl.period, s))); toast('Cierre exportado.', 'success'); }
function exportHistoryCSV(){
  const list = allClosures();
  if(!list.length){ toast('No hay cierres para exportar.', 'warn'); return; }
  const head = ['Periodo', 'Fecha de cierre', 'Versión', 'Fecha reapertura', 'Motivo reapertura', 'Publicados', 'Cobrables', 'Incorporados', 'Fuera de pago', 'Clientes', 'Banners (UF)', 'Leads (UF)', 'Incorporación (UF)', 'Total calculado (UF)', 'Total facturado (UF)', 'Diferencia (UF)', 'IVA informativo (UF)', 'Total final (UF)', 'Estado general', 'Observaciones'];
  const rows = list.map(c => { const s = c.snapshot, it = k => fmtNum((s.items.find(i => i.key === k) || {}).billedTotal);
    return [periodLabel(c.period), fmtStamp(c.closedAt), c.active ? 'Vigente' : 'Reabierto', c.reopenedAt ? fmtStamp(c.reopenedAt) : '', c.reopenReason || '', s.counts.published, s.counts.chargeable, s.counts.incorporatedAll, s.counts.out, s.counts.clients, it('banner'), it('leads'), it('inc'), fmtNum(s.subAuto), fmtNum(s.subBilled), fmtNum(s.diff), s.ivaOn ? fmtNum(s.iva) : '', fmtNum(s.total), s.general, [s.obs, s.closeNote].filter(Boolean).join(' | ')]; });
  download(`Historial_${cfg().counterpart}_${stampFile()}.csv`, toCSV([head, ...rows])); toast('Historial exportado.', 'success');
}
function downloadBackup(){
  download(`Respaldo_Control_${cfg().counterpart}_${stampFile()}.json`, JSON.stringify(Object.assign({app:'Control_TOCTOC_Itau', exportedAt:nowStamp()}, state), null, 2), 'application/json');
  addLog('Respaldo descargado', ''); save(); toast('Respaldo JSON descargado.', 'success');

function pickFile(accept, cb){ const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => { if(i.files[0]) cb(i.files[0]); }; i.click(); }
function readText(file, cb){
  const fr = new FileReader();
  fr.onload = () => { let t = String(fr.result); if(t.includes('\uFFFD')){ const f2 = new FileReader(); f2.onload = () => cb(String(f2.result)); f2.readAsText(file, 'windows-1252'); } else cb(t); };
  fr.onerror = () => toast('No se pudo leer el archivo.', 'error');
  fr.readAsText(file, 'UTF-8');
}
function restoreBackup(){
  pickFile('.json,application/json', file => readText(file, txt => {
    let obj; try { obj = JSON.parse(txt); } catch(e){ toast('El archivo no es un JSON válido.', 'error'); return; }
    if(!obj || !Array.isArray(obj.projects) || !obj.config){ toast('El archivo no corresponde a un respaldo de esta herramienta.', 'error'); return; }
    confirmDialog({title:'Restaurar respaldo', danger:true, confirmLabel:'Restaurar', message:`<p>Archivo: <b>${esc(file.name)}</b> (${obj.projects.length} proyectos, ${Object.keys(obj.closures || {}).length} cierres${obj.exportedAt ? ', exportado el ' + fmtStamp(obj.exportedAt) : ''}).</p><div class="notice n-warn"><span class="ic">⚠</span><div>La información actual compartida con el equipo será reemplazada. Descarga un respaldo antes si la necesitas.</div></div>`})
    .then(r => { if(!r.ok) return; delete obj.app; delete obj.exportedAt; state = normalizeState(obj); addLog('Respaldo restaurado', file.name); save(); toast('Respaldo restaurado correctamente.', 'success'); renderAll(); });
  }));
}
/* ---------- Importación CSV con mapeo y vista previa ---------- */
let imp = null;
const IMP_FIELDS = [
  ['name', 'IDENTIFICACIÓN PROYECTO', ['identificacion proyecto', 'proyecto', 'nombre']],
  ['group', 'Grupo', ['grupo', 'inmobiliaria']],
  ['toctoc', 'Estado TOC TOC', ['estado toc toc', 'estado toctoc', 'estado']],
  ['pub', 'Fecha Publicación', ['fecha publicacion', 'fecha de publicacion', 'publicacion']],
  ['nopay', 'Desde Fecha No Pago', ['desde fecha no pago', 'fecha no pago', 'no pago']],
  ['notes', 'Detalle', ['detalle', 'observacion', 'observaciones']]
];
function parseCSV(text){
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r => r.map(c => c.replace(/^\uFEFF/, '').trim()));
}
function normalizeToctoc(raw){
  const n = norm(raw);
  if(!n) return {v:'Pendiente', warn:'Estado vacío: se asigna "Pendiente".'};
  if(n.includes('no cliente')) return {v:'Publicado, No cliente'};
  if(n.includes('eliminado') && n.includes('landing')) return {v:'Eliminado de landing'};
  if(n.includes('eliminado') && (n.includes('pago') || n.includes('cobro'))) return {v:'Eliminado de pago'};
  if(n.includes('cliente')) return {v:'Publicado, Cliente'};
  if(n.includes('pendiente')) return {v:'Pendiente'};
  return {v:'Pendiente', warn:`Estado "${raw}" no reconocido: se asigna "Pendiente".`};
}
function openImportCSV(){
  pickFile('.csv,.txt,text/csv', file => readText(file, txt => {
    const all = parseCSV(txt).filter(r => r.some(c => c));
    if(!all.length){ toast('El archivo está vacío.', 'error'); return; }
    let hi = all.findIndex(r => r.filter(c => IMP_FIELDS.some(f => f[2].includes(norm(c)))).length >= 2);
    if(hi < 0) hi = 0;
    const headers = all[hi];
    const map = {};
    IMP_FIELDS.forEach(([k, , aliases]) => { let idx = headers.findIndex(h => norm(h) === aliases[0]); if(idx < 0) idx = headers.findIndex(h => aliases.includes(norm(h))); map[k] = idx; });
    imp = {fileName:file.name, headers, data:all.slice(hi + 1), map, fmt:'DMY', decisions:{}, overrides:{}, confirms:{}, skipErrors:false};
    imp.modal = openModal({title:'Importar proyectos desde CSV', body:'', size:'lg', buttons:[]});
    renderImport();
  }));
}
function impCell(r, k){ const i = imp.map[k]; return i >= 0 && i < r.length ? r[i] : ''; }
function impAnalyze(){
  const N = cfg().maxMonths, seen = {};
  let dmyOK = 0, mdyOK = 0;
  const res = imp.data.map((r, i) => {
    const name = impCell(r, 'name'), group = impCell(r, 'group') || 'SIN GRUPO';
    const tt = normalizeToctoc(impCell(r, 'toctoc'));
    const pubRaw = imp.overrides[i] != null ? imp.overrides[i] : impCell(r, 'pub');
    const pub = imp.overrides[i] != null ? (imp.overrides[i].trim() ? (parseCLStrict(imp.overrides[i]) ? {iso:parseCLStrict(imp.overrides[i])} : {error:'Fecha inválida (DD/MM/AAAA)'}) : {iso:'', empty:true}) : parseDateFlexible(pubRaw, imp.fmt);
    const np = parseDateFlexible(impCell(r, 'nopay'), imp.fmt);
    const out = {i, name, group, toctoc:tt.v, pubRaw, pub, np, notes:impCell(r, 'notes'), issues:[], block:false, ambiguous:false, dup:null};
    if(!name){ out.issues.push(['red', 'Sin nombre de proyecto']); out.block = true; }
    if(tt.warn) out.issues.push(['yellow', tt.warn]);
    if(pub.error){ out.issues.push(['red', pub.error + ': corrige la fecha']); out.block = true; }
    else if(pub.empty) out.issues.push(['yellow', 'Sin fecha: se importará con alerta']);
    if(np.error && impCell(r, 'nopay')) out.issues.push(['yellow', '"Desde Fecha No Pago" inválida: se ignora']);
    // Consistencia publicación vs "desde no pago" para detectar formato MM/DD
    const rawP = impCell(r, 'pub'), rawN = impCell(r, 'nopay');
    const pd = parseDateFlexible(rawP, 'DMY'), nd = parseDateFlexible(rawN, 'DMY'), pm = parseDateFlexible(rawP, 'MDY'), nm = parseDateFlexible(rawN, 'MDY');
    if(pd.iso && nd.iso && monthDiff(ymOf(pd.iso), ymOf(nd.iso)) === N) dmyOK++;
    if(pm.iso && nm.iso && monthDiff(ymOf(pm.iso), ymOf(nm.iso)) === N) mdyOK++;
    if(pub.iso && np.iso && imp.overrides[i] == null && monthDiff(ymOf(pub.iso), ymOf(np.iso)) !== N){
      out.ambiguous = true;
      if(!imp.confirms[i]){ out.issues.push(['red', `Fecha ambigua: con este formato la publicación (${fmtCL(pub.iso)}) no calza con "no pago" (${fmtCL(np.iso)}). Corrige o confirma.`]); out.block = true; }
      else out.issues.push(['yellow', 'Fecha confirmada manualmente']);
    }
    // Duplicados contra la base y dentro del archivo
    const key = norm(name) + '|' + norm(group);
    const ex = state.projects.find(p => norm(p.name) + '|' + norm(p.group) === key);
    if(name && ex){ out.dup = ex; out.issues.push(['orange', 'Ya existe en la base']); }
    if(name && seen[key] != null){ out.issues.push(['orange', `Repetido en el archivo (fila ${seen[key] + 1})`]); out.dupFile = true; }
    if(name && seen[key] == null) seen[key] = i;
    out.decision = (out.dup || out.dupFile) ? (imp.decisions[i] || 'skip') : 'new';
    if(out.decision === 'skip') out.block = false;
    return out;
  });
  return {res, dmyOK, mdyOK};
}
function impSetMap(k, v){ imp.map[k] = +v; renderImport(); }
function impSet(k, v){ imp[k] = v; renderImport(); }
function impDecision(i, v){ imp.decisions[i] = v; renderImport(); }
function impOverride(i, v){ imp.overrides[i] = v; renderImport(); }
function impConfirm(i, v){ imp.confirms[i] = v; renderImport(); }
function renderImport(){
  const {res, dmyOK, mdyOK} = impAnalyze(), m = imp.modal;
  const headOpts = k => `<select onchange="impSetMap('${k}',this.value)"><option value="-1">— No importar —</option>${imp.headers.map((h, i) => `<option value="${i}" ${imp.map[k] === i ? 'selected' : ''}>${esc(h || 'Columna ' + (i + 1))}</option>`).join('')}</select>`;
  const blocking = res.filter(r => r.block && r.decision !== 'skip');
  const toImport = res.filter(r => r.decision !== 'skip' && !(r.block));
  const suggest = imp.fmt === 'DMY' && mdyOK > dmyOK;
  const rowsHTML = res.map(r => {
    const isDup = r.dup || r.dupFile;
    const dateCell = (r.pub.error || r.ambiguous || imp.overrides[r.i] != null)
      ? `<input class="mini ${r.pub.error ? 'invalid' : ''}" style="width:105px" placeholder="DD/MM/AAAA" value="${esc(imp.overrides[r.i] != null ? imp.overrides[r.i] : (r.pub.iso ? fmtCL(r.pub.iso) : r.pubRaw))}" onchange="impOverride(${r.i},this.value)"><div class="small muted">Original: ${esc(impCell(imp.data[r.i], 'pub')) || '—'}</div>`
      : (r.pub.iso ? fmtCL(r.pub.iso) : '<span class="muted">—</span>');
    return `<tr class="${r.block && r.decision !== 'skip' ? 'r-red' : r.decision === 'skip' ? 'r-gray' : ''}">
      <td>${r.i + 1}</td><td class="name-cell">${esc(r.name) || '—'}</td><td>${esc(r.group)}</td><td>${badge(r.toctoc, r.toctoc === 'Publicado, Cliente' ? 'blue' : 'navy')}</td>
      <td>${dateCell}</td><td>${r.np.iso ? fmtCL(r.np.iso) : '—'}</td><td class="notes-cell">${esc(r.notes)}</td>
      <td>${r.issues.length ? r.issues.map(([c, t]) => `<div style="margin-bottom:3px">${badge(t, c).replace('class="badge','class="badge wrap')}</div>`).join('') : badge('OK', 'green')}
        ${r.ambiguous && imp.overrides[r.i] == null ? `<label class="check small"><input type="checkbox" ${imp.confirms[r.i] ? 'checked' : ''} onchange="impConfirm(${r.i},this.checked)"> Confirmo la fecha</label>` : ''}</td>
      <td>${isDup ? `<select class="mini" onchange="impDecision(${r.i},this.value)">${optionList([['skip', 'Omitir'], ...(r.dup ? [['update', 'Actualizar existente']] : []), ['new', 'Importar como nuevo']], r.decision)}</select>` : 'Nuevo'}</td></tr>`;
  }).join('');
  m.setBody(`
    <p>Archivo: <b>${esc(imp.fileName)}</b> · ${imp.data.length} filas de datos.</p>
    <div class="card" style="padding:12px"><div class="card-title"><h3>1. Mapeo de columnas</h3></div>
      <div class="filters">${IMP_FIELDS.map(([k, label]) => `<div class="field"><label>${label}</label>${headOpts(k)}</div>`).join('')}
        <div class="field"><label>Formato de fecha del archivo ${info('Por defecto DD/MM/AAAA (Chile). Usa MM/DD/AAAA solo si el archivo viene de Excel configurado en inglés.')}</label><select onchange="impSet('fmt',this.value)">${optionList([['DMY', 'DD/MM/AAAA (Chile)'], ['MDY', 'MM/DD/AAAA (Excel en inglés)']], imp.fmt)}</select></div></div>
      ${suggest ? `<div class="notice n-warn"><span class="ic">⚠</span><div><b>Posible formato MM/DD/AAAA detectado.</b> En ${mdyOK} fila(s) la "Fecha Publicación" y "Desde Fecha No Pago" solo calzan con ${cfg().maxMonths} meses de diferencia si se leen como MM/DD/AAAA (ej.: 03/01/2026 → 01/03/2026). No se cambia automáticamente: confirma el formato. <button class="btn btn-sm btn-ghost" onclick="impSet('fmt','MDY')">Usar MM/DD/AAAA</button></div></div>` : ''}
    </div>
    <div class="card" style="padding:12px"><div class="card-title"><h3>2. Vista previa y decisiones</h3>
      <div class="small">${badge(toImport.length + ' por importar', 'green')} ${badge(res.filter(r => r.decision === 'skip').length + ' omitidos', 'gray')} ${badge(blocking.length + ' con errores', blocking.length ? 'red' : 'gray')}</div></div>
      ${blocking.length ? `<div class="notice n-error"><span class="ic">⚠</span><div>Hay ${blocking.length} fila(s) con fechas inválidas o ambiguas. Corrígelas en la columna de fecha, confirma la fecha, o marca la opción para omitirlas.</div></div><label class="check" style="margin-bottom:8px"><input type="checkbox" ${imp.skipErrors ? 'checked' : ''} onchange="impSet('skipErrors',this.checked)"> Omitir filas con errores y continuar</label>` : ''}
      <div class="table-wrap" style="max-height:48vh"><table class="data"><thead><tr><th>#</th><th>Proyecto</th><th>Grupo</th><th>Estado TOCTOC</th><th>Fecha publicación</th><th>Desde no pago</th><th>Detalle</th><th>Validación</th><th>Decisión</th></tr></thead><tbody>${rowsHTML || '<tr><td colspan="9">' + emptyState('📄', 'Sin filas', 'El archivo no contiene datos bajo el encabezado.') + '</td></tr>'}</tbody></table></div>
    </div>`);
  m.setButtons([{label:'Cancelar', onClick: x => x.close()},
    {label:`⇪ Importar ${toImport.length} registro(s)`, cls:'btn-primary', disabled: !toImport.length || (blocking.length && !imp.skipErrors), onClick: x => doImport(x)}]);
}
function doImport(m){
  const {res} = impAnalyze();
  let added = 0, updated = 0, skipped = 0;
  res.forEach(r => {
    if(r.decision === 'skip' || r.block){ skipped++; return; }
    const fields = {name:r.name, group:r.group, toctoc:r.toctoc, pubDate:r.pub.iso || '', notes:r.notes, noPayImported:r.np.iso || '',
      landing: r.toctoc === 'Eliminado de landing' ? 'Eliminado de landing' : r.toctoc === 'Pendiente' ? 'Pendiente de publicación' : 'Publicado', updatedAt:nowStamp()};
    if(r.decision === 'update' && r.dup){ Object.assign(r.dup, fields); updated++; }
    else { state.projects.push(Object.assign({id:uid(), demo:false, archived:false, billingRemoved:null, landingRemoved:null, billingHistory:[], createdAt:nowStamp()}, fields)); added++; }
  });
  addLog('Importación CSV', `${imp.fileName}: ${added} nuevos, ${updated} actualizados, ${skipped} omitidos`);
  save(); m.close(); toast(`Importación completa: ${added} nuevos, ${updated} actualizados, ${skipped} omitidos.`, 'success'); renderAll();
}
